let groups=defaultGroups(),destinationEditing=false,destinationDialog=null,destinationGesture=null;
try{const loaded=JSON.parse(localStorage.getItem(GROUPS_KEY));if(Array.isArray(loaded)&&loaded.length)groups=loaded}catch{}
function persistGroups(){try{localStorage.setItem(GROUPS_KEY,JSON.stringify(groups))}catch(e){console.warn('group save failed',e)}}
const folderIcon=(blue=false)=>'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="'+(blue?'#3bb0d0':'#d55a9f')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>';

function destinationLabel(){const d=selectedDestination(),g=groups.find(x=>x.id===d.groupId),f=g?.folders.find(x=>x.id===d.folderId);return g?g.name+' › '+(f?f.name:'直接保存'):'未選択'}
function destinationMarkup(){const sel=selectedDestination();return '<div class="destination-screen"><div class="dest-head"><h2>保存先をえらぶ</h2><button type="button" data-dest="edit" class="dest-edit">'+(destinationEditing?'✓ 完了':'⋯ 編集')+'</button></div><p class="dest-help">'+(destinationEditing?'鉛筆で名前変更。二本線を指でつかんで並び替えてね。':'グループに直接保存することも、フォルダに保存することもできます。')+'</p><div class="dest-list-label">コーデリスト</div><div class="dest-scroll">'+groups.map((g,gi)=>'<section class="dest-group" data-group-id="'+esc(g.id)+'"><div class="dest-group-header"><button type="button" data-dest="toggle" data-gid="'+esc(g.id)+'" class="dest-group-toggle"><span class="dest-chevron">'+(g.open?'⌄':'›')+'</span>'+folderIcon()+'<span class="dest-group-name">'+esc(g.name)+'</span></button>'+(destinationEditing?'<button type="button" class="dest-pencil" data-dest="rename-group" data-gid="'+esc(g.id)+'" aria-label="グループ名変更">✎</button><span class="dest-handle" data-sort="group" data-id="'+esc(g.id)+'" aria-label="グループをドラッグで並び替え">'+handleIcon+'</span>':'<span class="dest-chevron">'+(g.open?'⌃':'⌄')+'</span>')+'</div>'+(g.open?(destinationEditing?'<div class="dest-folder-edit">'+g.folders.map(f=>'<div class="dest-folder-line" data-folder-id="'+esc(f.id)+'" data-parent-id="'+esc(g.id)+'"><span class="dest-indent">↳</span>'+folderIcon(true)+'<span class="dest-folder-long">'+esc(f.name)+'</span><button type="button" class="dest-pencil" data-dest="rename-folder" data-gid="'+esc(g.id)+'" data-fid="'+esc(f.id)+'" aria-label="フォルダ名変更">✎</button><span class="dest-handle" data-sort="folder" data-id="'+esc(f.id)+'" data-parent="'+esc(g.id)+'" aria-label="フォルダをドラッグで並び替え">'+handleIcon+'</span></div>').join('')+'<button type="button" class="dest-add-folder-line" data-dest="add-folder" data-gid="'+esc(g.id)+'">⊞ フォルダを追加</button></div>':'<div class="dest-folder-select"><button type="button" class="dest-direct '+(sel.groupId===g.id&&!sel.folderId?'chosen':'')+'" data-dest="select" data-gid="'+esc(g.id)+'" data-fid="">'+(sel.groupId===g.id&&!sel.folderId?'◉':'◯')+' フォルダを使わず直接保存</button><div class="dest-folder-grid">'+g.folders.map(f=>'<button type="button" class="dest-folder-tile '+(sel.groupId===g.id&&sel.folderId===f.id?'chosen':'')+'" data-dest="select" data-gid="'+esc(g.id)+'" data-fid="'+esc(f.id)+'"><span>'+esc(f.name)+'</span>'+(sel.groupId===g.id&&sel.folderId===f.id?'<b>✓</b>':'')+'</button>').join('')+'<button type="button" class="dest-folder-tile dest-add-tile" data-dest="add-folder" data-gid="'+esc(g.id)+'">＋ フォルダを追加</button></div></div>'):'')+'</section>').join('')+'<button type="button" class="dest-add-group" data-dest="add-group">⊞ 新しいグループを追加</button></div><div class="dest-bottom"><div class="dest-selected"><small>選択した保存先</small><strong>▱ '+esc(destinationLabel())+'</strong></div><button type="button" class="dest-confirm" data-act="confirm" '+(destinationEditing?'disabled':'')+'>この保存先に決定 ♡</button></div><div id="dest-dialog" class="dest-dialog" hidden></div></div>'}
function showDestinationDialog(mode,gid,fid){destinationDialog={mode,gid,fid};const g=groups.find(x=>x.id===gid),f=g?.folders.find(x=>x.id===fid),old=mode==='rename-group'?g?.name:mode==='rename-folder'?f?.name:'';const box=document.getElementById('dest-dialog');if(!box)return;box.hidden=false;box.innerHTML='<div class="dest-dialog-box"><div class="dest-dialog-top"><strong>♡ '+(mode.startsWith('rename')?'名前を変更':mode==='add-group'?'グループを追加':'フォルダを追加')+' ♡</strong><button type="button" data-dest="close-dialog">×</button></div><input id="dest-name" maxlength="120" value="'+esc(old||'')+'" placeholder="名前を入力"><div class="dest-dialog-actions"><button type="button" data-dest="close-dialog">キャンセル</button><button type="button" data-dest="apply-dialog">'+(mode.startsWith('rename')?'変更':'追加')+'</button></div>'+(mode.startsWith('rename')?'<button type="button" class="dest-delete" data-dest="delete-dialog">削除する</button>':'')+'</div>';box.querySelector('input')?.focus()}
function destinationAction(btn){const act=btn.dataset.dest,gid=btn.dataset.gid,fid=btn.dataset.fid,g=groups.find(x=>x.id===gid);if(act==='edit'){destinationEditing=!destinationEditing;render();return true}if(act==='toggle'&&g){g.open=!g.open;persistGroups();render();return true}if(act==='select'&&g){draft.destination={groupId:gid,folderId:fid||null};saveDraft();render();return true}if(['add-group','add-folder','rename-group','rename-folder'].includes(act)){showDestinationDialog(act,gid,fid);return true}if(act==='close-dialog'){destinationDialog=null;document.getElementById('dest-dialog').hidden=true;return true}if(act==='apply-dialog'&&destinationDialog){const val=document.getElementById('dest-name')?.value.trim();if(!val)return true;const d=destinationDialog,gg=groups.find(x=>x.id===d.gid);if(d.mode==='add-group')groups.push({id:crypto.randomUUID(),name:val,open:true,folders:[]});if(d.mode==='add-folder'&&gg){gg.folders.push({id:crypto.randomUUID(),name:val});gg.open=true}if(d.mode==='rename-group'&&gg)gg.name=val;if(d.mode==='rename-folder'&&gg){const ff=gg.folders.find(x=>x.id===d.fid);if(ff)ff.name=val}destinationDialog=null;persistGroups();render();return true}if(act==='delete-dialog'&&destinationDialog){if(!confirm('本当に削除する？ 保存済みのコーデは削除されません。'))return true;const d=destinationDialog;if(d.mode==='rename-group')groups=groups.filter(x=>x.id!==d.gid);if(d.mode==='rename-folder'){const gg=groups.find(x=>x.id===d.gid);if(gg)gg.folders=gg.folders.filter(x=>x.id!==d.fid)}const sel=selectedDestination();if(!groups.some(x=>x.id===sel.groupId))draft.destination={groupId:groups[0]?.id||'',folderId:null};else if(sel.folderId&&!groups.find(x=>x.id===sel.groupId)?.folders.some(x=>x.id===sel.folderId))draft.destination={groupId:sel.groupId,folderId:null};destinationDialog=null;persistGroups();saveDraft();render();return true}return false}
function finishDestinationDrag(e,cancelled=false){const d=destinationGesture;if(!d)return;destinationGesture=null;d.source?.classList.remove('dest-dragging');document.querySelectorAll('.dest-drop-target').forEach(x=>x.classList.remove('dest-drop-target'));if(!cancelled&&d.target&&d.moved){if(d.kind==='group'){const i=groups.findIndex(g=>g.id===d.id),j=groups.findIndex(g=>g.id===d.target.dataset.groupId);if(i>=0&&j>=0&&i!==j){const [g]=groups.splice(i,1);groups.splice(j,0,g)}}else{const g=groups.find(x=>x.id===d.parent),i=g?.folders.findIndex(f=>f.id===d.id),j=g?.folders.findIndex(f=>f.id===d.target.dataset.folderId);if(g&&i>=0&&j>=0&&i!==j){const [f]=g.folders.splice(i,1);g.folders.splice(j,0,f)}}persistGroups();render()}else if(d.moved){render()} }

function status(cat){const i=item(cat);return i.checked?'登録済み':i.image||i.qrPhoto||i.qrDigital||i.colors.length||i.commonFull||i.commonTB?'QR未登録':'未登録';}

'アクセ':'<path d="M3 8 7.5 12 12 5l4.5 7L21 8l-2 11H5L3 8Z"/><path d="M5 21h14"/>',

'ボトムス':'<path d="M6 3h12l2 19h-7l-1-10-1 10H4L6 3Z"/><path d="M6 8h12"/>',
'シューズ':'<path d="M3 15c3 0 5-3 7-7l3 1c1 4 3 5 8 6v4H3v-4Z"/><path d="M3 16h18"/>',
'ワンピース':'<path d="M9 3 7 6 4 7 2 12l5 2 2-4v4L4 21h16l-5-7v-4l2 4 5-2-2-5-3-1-2-3-3 3-3-3Z"/><path d="M9 14h6"/>'};
return '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+(p[cat]||p['アクセ'])+'</svg>'}

function openDB(){if(db)return Promise.resolve(db);return new Promise((ok,no)=>{const r=indexedDB.open(D,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)})}
async function toDataURL(value){return new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=()=>no(reader.error||new Error('FileReader failed'));reader.readAsDataURL(value)})}
async function fromDataURL(value){const response=await fetch(value);return response.blob()}
async function fallbackImage(original){
  // Reduce image size for Safari environments where IndexedDB is unavailable.
  try{
    const objectUrl=URL.createObjectURL(original);
    try{
      const image=await new Promise((ok,no)=>{const img=new Image();img.onload=()=>ok(img);img.onerror=()=>no(new Error('画像形式を読み込めません'));img.src=objectUrl});
      const ratio=Math.min(1,800/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
      const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const compressed=await new Promise(ok=>canvas.toBlob(ok,'image/jpeg',0.72));return compressed||original;
    }finally{URL.revokeObjectURL(objectUrl)}
  }catch(e){return original}
}
async function store(value){
  const id=crypto.randomUUID();
  try{
    const d=await openDB();
    await new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(value,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error||new Error('IndexedDB write failed'));t.onabort=()=>no(t.error||new Error('IndexedDB aborted'))});
    return id;
  }catch(primaryError){
    console.warn('IndexedDB unavailable, using reduced-size local fallback',primaryError);
    try{localStorage.setItem('pricoletta_fallback_'+id,await toDataURL(await fallbackImage(value)));return id}
    catch(fallbackError){const err=new Error('画像保存領域を利用できません。Safariの通常タブで開き、サイトのストレージ設定・空き容量を確認してください。');err.name='StorageUnavailable';err.cause=fallbackError;throw err}
  }
}
async function blob(id){
  if(!id)return null;
  try{const d=await openDB();const value=await new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)});if(value)return value}catch(e){console.warn('IndexedDB read failed',e)}
  const fallback=localStorage.getItem('pricoletta_fallback_'+id);return fallback?fromDataURL(fallback):null
}
async function url(id){const b=await blob(id);if(!b)return '';const u=URL.createObjectURL(b);urls.push(u);return u}
function revoke(){urls.forEach(URL.revokeObjectURL);urls=[]}

else if(key==='register')content.innerHTML='<h1 class="page-title">♡ アイテムを登録 ♡</h1><p class="page-sub">登録方法をえらんでね</p><div class="registration-list">'+[['single','ひとつずつ登録','アイテムを1つずつ登録する'],['batch','まとめて登録','同じコーデのアイテムをまとめて登録する'],['pro','まとめて登録 Pro','異なるコーデのアイテムもまとめて登録する（上級者向け）']].map(x=>'<button class="registration-option" data-method="'+x[0]+'"><span class="registration-name">'+x[1]+' ›</span><span class="registration-description">'+x[2]+'</span></button>').join('')+'<div class="registration-unavailable">URLから登録<br><small>現在、この機能はご利用いただけません。</small></div></div>';
else if(key==='items')listRecords();else content.innerHTML='<div class="placeholder"><h2>'+heading.textContent+'</h2><p>このページはこれから追加できます。</p></div>';content.scrollTop=0}

let ui= parse(UIKEY,{order:[],marks:{}}),filterGroups={},allGroups=true,folderOpen=false,groupOpen={},sortOpen=false,sortMode='registered',editingOrder=false,ownedFilter='all',markFilter='all',queryText='',dragRecord=null;

function locationOf(r){let d=r.destinationRef;if(d&&typeof d==='object')return {g:d.groupId,f:d.folderId||'direct'};const g=groups.find(x=>x.name===r.destination);return {g:g?.id||'',f:'direct'}}

function filteredRecords(){return parse(S,[]).filter(r=>{const l=locationOf(r),sel=filterGroups[l.g],c=countOf(r),m=markOf(r);return (allGroups||sel&&(sel.all||sel.folders.includes(l.f)))&&r.name.toLocaleLowerCase().includes(queryText.toLocaleLowerCase())&&(ownedFilter==='all'||ownedFilter==='complete'&&c.n===c.total||ownedFilter==='partial'&&c.n>0&&c.n<c.total||ownedFilter==='none'&&c.n===0)&&(markFilter==='all'||markFilter==='fav'&&m.fav||markFilter==='want'&&m.want||markFilter==='both'&&m.fav&&m.want)}).sort((a,b)=>sortMode==='name'?a.name.localeCompare(b.name,'ja'):sortMode==='owned'?countOf(b).n-countOf(a).n:sortMode==='original'?ui.order.indexOf(a.id)-ui.order.indexOf(b.id):0)}

async function loadImageForCanvas(file){
  try{return await createImageBitmap(file)}catch(e){
    const source=URL.createObjectURL(file);
    try{const img=new Image();img.decoding='async';img.src=source;await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject});
      return {width:img.naturalWidth,height:img.naturalHeight,close(){URL.revokeObjectURL(source)},_img:img};
    }catch(err){URL.revokeObjectURL(source);throw err}
  }
}
async function trayPreview(id){
  const original=await blob(id);if(!original)return '';
  try{
    const bitmap=await loadImageForCanvas(original), max=440, ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bitmap.width*ratio));cv.height=Math.max(1,Math.round(bitmap.height*ratio));
    const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap._img||bitmap,0,0,cv.width,cv.height);bitmap.close?.();
    const w=cv.width,h=cv.height,imageData=ctx.getImageData(0,0,w,h),d=imageData.data;
    // Detect only edge-connected transparent/near-white background; keep internal white artwork.
    const isBg=(j)=>d[j+3]<35||(d[j+3]>245&&d[j]>244&&d[j+1]>244&&d[j+2]>244);
    let borderSamples=0,bgSamples=0;
    for(let x=0;x<w;x+=Math.max(1,Math.floor(w/35))){borderSamples+=2;if(isBg(x*4))bgSamples++;if(isBg(((h-1)*w+x)*4))bgSamples++}
    for(let y=0;y<h;y+=Math.max(1,Math.floor(h/35))){borderSamples+=2;if(isBg(y*w*4))bgSamples++;if(isBg((y*w+w-1)*4))bgSamples++}
    if(bgSamples/borderSamples<.85)return url(id);
    const visited=new Uint8Array(w*h),stack=[];
    function enqueue(x,y){if(x<0||y<0||x>=w||y>=h)return;const k=y*w+x;if(visited[k]||!isBg(k*4))return;visited[k]=1;stack.push(k)}
    for(let x=0;x<w;x++){enqueue(x,0);enqueue(x,h-1)}
    for(let y=0;y<h;y++){enqueue(0,y);enqueue(w-1,y)}
    while(stack.length){const k=stack.pop(),x=k%w,y=Math.floor(k/w);
      enqueue(x-1,y);enqueue(x+1,y);enqueue(x,y-1);enqueue(x,y+1);
    }
    let left=w,top=h,right=-1,bottom=-1;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x,j=k*4;
      if(visited[k]){d[j+3]=0;continue}
      if(d[j+3]>=32){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x);bottom=Math.max(bottom,y)}
    }
    if(right<left||bottom<top)return url(id);
    const pad=Math.max(2,Math.round(Math.max(right-left,bottom-top)*.025));
    left=Math.max(0,left-pad);top=Math.max(0,top-pad);right=Math.min(w-1,right+pad);bottom=Math.min(h-1,bottom+pad);
    if((right-left+1)*(bottom-top+1)>w*h*.94)return url(id);
    ctx.putImageData(imageData,0,0);
    const out=document.createElement('canvas');out.width=right-left+1;out.height=bottom-top+1;
    out.getContext('2d').drawImage(cv,left,top,out.width,out.height,0,0,out.width,out.height);
    const cropped=await new Promise(ok=>out.toBlob(ok,'image/png'));if(!cropped)return url(id);
    const u=URL.createObjectURL(cropped);urls.push(u);return u;
  }catch(e){console.warn('preview crop skipped',e);return url(id)}
}

async function analyze(cat){const i=item(cat);if(i.manualColors)return;const score=new Map(COLORS.map(([n])=>[n,0]));for(const [n] of COLORS)if(draft.name.includes(n))score.set(n,10000);if(i.image){try{const b=await blob(i.image),bitmap=await createImageBitmap(b),cv=document.createElement('canvas');cv.width=cv.height=48;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,48,48);bitmap.close();const data=ctx.getImageData(0,0,48,48).data;for(let j=0;j<data.length;j+=16){if(data[j+3]<128)continue;if(data[j]>247&&data[j+1]>247&&data[j+2]>247)continue;let best='',dist=Infinity;for(const [n,hex] of COLORS){const rgb=[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16));const d=rgb.reduce((s,v,k)=>s+(v-data[j+k])**2,0);if(d<dist){dist=d;best=n}}score.set(best,score.get(best)+1)}}catch(e){console.warn(e)}}i.rank=[...score].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);i.colors=i.rank.slice(0,2);saveDraft();colors()}
async function readQR(id){const b=await blob(id),bitmap=await createImageBitmap(b);try{if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const results=await detector.detect(bitmap);if(results[0]?.rawValue)return results[0].rawValue}catch(e){console.warn(e)}}if(typeof jsQR==='function'){const cv=document.createElement('canvas');const max=1200,ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));cv.width=Math.round(bitmap.width*ratio);cv.height=Math.round(bitmap.height*ratio);const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,cv.width,cv.height);const d=ctx.getImageData(0,0,cv.width,cv.height);return jsQR(d.data,d.width,d.height)?.data||null}return null}finally{bitmap.close()}}

  for(const c of targets){const dest=item(c);if(c!==cat){dest.qrPhoto=source.qrPhoto||null;dest.qrDigital=source.qrDigital||null;dest.qrPayload=source.qrPayload||null;dest.qrError=source.qrError||'';dest.checked=!!(source.qrPhoto||source.qrDigital||source.qrPayload||source.checked)}

function setCommonMode(cat,mode){const scope=mode==='full'?CATS[draft.type]:mode==='tb'&&draft.type==='separate'?['トップス','ボトムス']:[];

async function assign(id,kind){if(['thumbnail','full'].includes(kind)){if(draft[kind])draft.unplaced.push(draft[kind]);draft[kind]=id}else{const i=item(draft.cat);if(kind==='image'){if(i.image)draft.unplaced.includes(i.image)||draft.unplaced.push(i.image);i.image=id;i.manualColors=false;await analyze(draft.cat)}else{if(i.qrPhoto&&!CATS[draft.type].some(c=>c!==draft.cat&&item(c).qrPhoto===i.qrPhoto))draft.unplaced.includes(i.qrPhoto)||draft.unplaced.push(i.qrPhoto);i.qrPhoto=id;i.qrDigital=null;i.qrPayload=null;i.qrError='';let value=null;try{value=await readQR(id)}catch(e){console.warn('QR decode failed',e)}if(value){try{i.qrDigital=await makeQR(value);i.qrPayload=value;i.checked=true}catch(e){i.qrError='QRは読み取れましたがデジタル化に失敗しました。チェックは自動変更していません。'}}else i.qrError='QRを読み取れませんでした。元の写真は保存しています。';syncCommonQR(draft.cat)}}draft.unplaced=draft.unplaced.filter(x=>x!==id);saveDraft()}

async function upload(kind){const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=kind==='tray';input.onchange=async()=>{if(!input.files?.length)return;try{for(const f of input.files){if(!f.type.startsWith('image/'))continue;const optimized=await optimizeImage(f,kind==='qr'?1800:1400);const id=await store(optimized);if(kind==='tray')draft.unplaced.push(id);else await assign(id,kind)}saveDraft();render()}catch(e){console.error('image save',e);alert('画像を保存できませんでした。'+(e?.message||e?.name||'保存領域のエラー')+'。')}};input.click()}
let selectedTray=null;
function chooseTray(id){selectedTray=id;document.querySelectorAll("[data-tray]").forEach(el=>el.classList.toggle("tray-selected",el.dataset.tray===id));document.querySelectorAll("[data-slot]").forEach(el=>el.classList.toggle("slot-target",["image","qr"].includes(el.dataset.slot)));}
function save(){const recs=parse(S,[]);const id=draft.existingId||crypto.randomUUID(),entry={id,name:draft.name,type:draft.type,items:draft.items,thumbnail:draft.thumbnail,full:draft.full,destination:destinationLabel(),destinationRef:selectedDestination(),updatedAt:new Date().toISOString()};const pos=recs.findIndex(r=>r.id===id);if(pos>=0)recs[pos]=entry;else recs.push(entry);try{localStorage.setItem(S,JSON.stringify(recs));const names=[...new Set([draft.name,...parse('pricoletta_coordinate_names',[])])];localStorage.setItem('pricoletta_coordinate_names',JSON.stringify(names));localStorage.removeItem(K);draft=fresh();alert('保存しました ♡');pages('items')}catch(e){alert('保存に失敗しました。端末の空き容量を確認してね')}}
function start(){draft=parse(K,fresh());if(!draft?.items||!Array.isArray(draft.unplaced))draft=fresh();render()}
$('#start-button').addEventListener('click',()=>{$('#title-screen').classList.add('hidden');$('#main-screen').classList.remove('hidden');pages('home')});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>pages(b.dataset.page)));
content.addEventListener('input',e=>{if(e.target.id==='name'){draft.name=e.target.value;saveDraft();suggest()}});
content.addEventListener('change',e=>{if(e.target.dataset.common){const mode=e.target.checked?e.target.dataset.common:'none';setCommonMode(draft.cat,mode);saveDraft();render();return}if(e.target.id==='registered'){item(draft.cat).checked=e.target.checked;syncCommonQR(draft.cat);saveDraft();render()}else if(e.target.matches('[data-color]')){const i=item(draft.cat),c=e.target.dataset.color;i.manualColors=true;i.colors=e.target.checked?[...new Set([...i.colors,c])]:i.colors.filter(x=>x!==c);saveDraft()}else if(e.target.name==='type'){draft.type=e.target.value;if(draft.type==='dress')for(const v of Object.values(draft.items))v.commonTB=false;saveDraft()}else if(e.target.name==='destination'){draft.destination=e.target.value;saveDraft()}});
content.addEventListener('click',async e=>{if(e.target.closest('[data-pi-item],[data-pi-itemmark],[data-pi-view],[data-pi-cat],[data-pi-drawer],[data-pi-owned],[data-pi-markfilter],[data-pi-tag],[data-pi-expand],[data-pi-manager],[data-pi-clear],[data-pi-addcat],[data-pi-renamecat],[data-pi-deletecat],[data-pi-addtag],[data-pi-renametag],[data-pi-deletetag]')){piItemAction(e.target.closest('button'));return;}if(e.target.closest('[data-pd]')){pdAction(e.target.closest('[data-pd]'));return;}if(e.target.closest('[data-detail]')){pdSelected=null;pdMode='image';pdShow(e.target.closest('[data-detail]').dataset.detail);return;}if(e.target.closest('[data-pi]')){piAction(e.target.closest('[data-pi]'));return;}if(suppressTap){suppressTap=false;return}if(busy)return;const b=e.target.closest('button,[data-slot],[data-tray]');if(!b)return;if(b.dataset.dest){destinationAction(b);return}if(b.dataset.go){pages(b.dataset.go);return}if(b.dataset.method){if(b.dataset.method==='single')start();else{heading.textContent=b.dataset.method==='batch'?'まとめて登録':'まとめて登録 Pro';content.innerHTML='<button class="back-to-registration" data-go="register">‹ 登録方法にもどる</button><div class="placeholder">この登録方法は今後実装予定です。</div>'}return}if(b.dataset.cat){selectedTray=null;draft.cat=b.dataset.cat;render();return}if(b.dataset.suggest){draft.name=b.dataset.suggest;render();return}if(b.dataset.existing){const r=parse(S,[]).find(x=>x.id===b.dataset.existing);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destinationRef||r.destination,existingId:r.id,step:2};render()}return}if(b.dataset.open){const r=parse(S,[]).find(x=>x.id===b.dataset.open);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destinationRef||r.destination,existingId:r.id,step:3};render()}return}if(b.dataset.removeTray){if(selectedTray===b.dataset.removeTray)selectedTray=null;draft.unplaced=draft.unplaced.filter(x=>x!==b.dataset.removeTray);saveDraft();render();return}if(b.dataset.return){await returnSlot(b.dataset.return);return}if(b.dataset.tray){chooseTray(b.dataset.tray);return}if(b.dataset.slot){if(selectedTray&&draft.unplaced.includes(selectedTray)&&['image','qr'].includes(b.dataset.slot)){const chosen=selectedTray;selectedTray=null;try{await assign(chosen,b.dataset.slot);render()}catch(e){alert('画像を配置できませんでした')}return}upload(b.dataset.slot);return}const a=b.dataset.act;if(!a)return;if(a==='qr-settings'){const p=$('#qr-settings-panel');if(p){p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))}return}if(a==='qr-settings-close'){$('#qr-settings-panel').hidden=true;return}if(a==='exit'){pages('register');return}if(a==='back'){draft.step=Math.max(0,draft.step-1);render();return}if(a==='name'){draft.name=$('#name')?.value.trim()||'';if(!draft.name){alert('コーデ名を入力してね');return}draft.step=1}else if(a==='new'){draft.existingId=null;draft.items={};draft.step=2}else if(a==='items'){draft.step=3;draft.cat=CATS[draft.type][0];for(const c of CATS[draft.type]){const i=item(c);if(!i.manualColors&&!i.image&&!i.colors.length){i.rank=COLORS.map(x=>x[0]);const names=COLORS.filter(x=>draft.name.includes(x[0])).map(x=>x[0]);if(names.length){i.rank=[...names,...i.rank.filter(x=>!names.includes(x))];i.colors=names.slice(0,2)}}}}else if(a==='destination'){draft.step=4;destinationEditing=false;}else if(a==='confirm')draft.step=5;else if(a==='save'){save();return}else if(a==='add'){upload('tray');return}render()});

content.addEventListener('pointerdown',e=>{if(!destinationEditing||draft.step!==4)return;const h=e.target.closest('.dest-handle');if(!h)return;e.preventDefault();const source=h.closest(h.dataset.sort==='group'?'.dest-group':'.dest-folder-line');destinationGesture={kind:h.dataset.sort,id:h.dataset.id,parent:h.dataset.parent||null,source,target:null,x:e.clientX,y:e.clientY,moved:false,pointer:e.pointerId};h.setPointerCapture(e.pointerId);source?.classList.add('dest-dragging')});
content.addEventListener('pointermove',e=>{const d=destinationGesture;if(!d||e.pointerId!==d.pointer)return;e.preventDefault();if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>7)d.moved=true;document.querySelectorAll('.dest-drop-target').forEach(x=>x.classList.remove('dest-drop-target'));const node=document.elementFromPoint(e.clientX,e.clientY),target=node?.closest(d.kind==='group'?'.dest-group':'.dest-folder-line');if(target&&target!==d.source&&(d.kind==='group'||target.dataset.parentId===d.parent)){d.target=target;target.classList.add('dest-drop-target')}else d.target=null;const list=document.querySelector('.dest-scroll');if(list&&d.moved){const rect=list.getBoundingClientRect();if(e.clientY<rect.top+40)list.scrollTop-=13;else if(e.clientY>rect.bottom-40)list.scrollTop+=13}});
content.addEventListener('pointerup',e=>{if(destinationGesture&&e.pointerId===destinationGesture.pointer)finishDestinationDrag(e)});
content.addEventListener('pointercancel',e=>{if(destinationGesture&&e.pointerId===destinationGesture.pointer)finishDestinationDrag(e,true)});

// Touch drag and pointer drag use a single fixed preview; tapping still selects an image.
let trayGesture=null;
function dragMove(x,y){if(!trayGesture)return;const g=trayGesture;if(!g.active&&Math.abs(x-g.x)>Math.abs(y-g.y)*1.15&&Math.abs(x-g.x)>7){g.scrolling=true;return}if(g.scrolling)return;if(Math.hypot(x-g.x,y-g.y)>12&&!g.active){g.active=true;const img=g.element.querySelector('img');g.ghost=img.cloneNode();g.ghost.className='tray-drag-ghost';g.ghost.style.width=g.element.offsetWidth+'px';g.ghost.style.height=g.element.offsetHeight+'px';document.body.append(g.ghost);g.element.classList.add('dragging')}
 if(g.active){g.ghost.style.left=(x-g.element.offsetWidth/2)+'px';g.ghost.style.top=(y-g.element.offsetHeight/2)+'px';document.querySelectorAll('.registration-fixed [data-slot="image"],.registration-fixed [data-slot="qr"]').forEach(el=>el.classList.toggle('drop-target',el===document.elementFromPoint(x,y)?.closest('[data-slot]')))}
}
async function dragEnd(x,y){const g=trayGesture;trayGesture=null;if(!g)return;g.ghost?.remove();g.element.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));if(!g.active)return;
 suppressTap=true;const slot=document.elementFromPoint(x,y)?.closest('[data-slot]');if(slot&&['image','qr'].includes(slot.dataset.slot)&&draft.unplaced.includes(g.id)){selectedTray=null;try{await assign(g.id,slot.dataset.slot);render()}catch(e){alert('画像を配置できませんでした')}}
 setTimeout(()=>{suppressTap=false},200);
}
content.addEventListener('touchstart',e=>{const el=e.target.closest('[data-tray]');if(!el||e.target.closest('[data-remove-tray]'))return;const t=e.touches[0];trayGesture={id:el.dataset.tray,element:el,x:t.clientX,y:t.clientY,active:false}},{passive:true});
content.addEventListener('touchmove',e=>{if(!trayGesture)return;const t=e.touches[0];dragMove(t.clientX,t.clientY);if(trayGesture?.active)e.preventDefault()},{passive:false});
content.addEventListener('touchend',e=>{if(trayGesture){const t=e.changedTouches[0];void dragEnd(t.clientX,t.clientY)}},{passive:true});
content.addEventListener('touchcancel',()=>{trayGesture?.ghost?.remove();trayGesture=null});
content.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-tray]');if(!el||e.target.closest('[data-remove-tray]'))return;trayGesture={id:el.dataset.tray,element:el,x:e.clientX,y:e.clientY,active:false} });
content.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&trayGesture)dragMove(e.clientX,e.clientY)});
content.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'&&trayGesture)void dragEnd(e.clientX,e.clientY)});

content.addEventListener('input',e=>{if(e.target.matches('[data-pi-itemsearch]')){piItemSearch=e.target.value;piItemRender();const input=content.querySelector('[data-pi-itemsearch]');input?.focus();try{input?.setSelectionRange(piItemSearch.length,piItemSearch.length)}catch{};return}if(e.target.matches('[data-pi-search]')){const p=e.target.selectionStart;queryText=e.target.value;listRecords();const input=content.querySelector('[data-pi-search]');input?.focus();try{input?.setSelectionRange(p,p)}catch{}}});content.addEventListener('pointerdown',piPointerDown);content.addEventListener('pointermove',piPointerMove);content.addEventListener('pointerup',piPointerEnd);content.addEventListener('pointercancel',piPointerEnd);
window.addEventListener('pagehide',saveDraft);
})();
</script></body></html>
