async function fallbackImage(original){

}
async function store(value){

    console.warn('IndexedDB unavailable, using reduced-size local fallback',primaryError);

}
async function blob(id){

function piEditSave(){
 if(!piInlineEdit)return;
 const {kind,cid,tag}=piInlineEdit,v=piInlineDraft.trim(),c=piTags.find(x=>x.id===cid);
 if(!v)return;
 if((kind==='cat'||kind==='newcat')&&piTags.some(x=>x.name===v&&x.id!==cid))return;
 if((kind==='tag'||kind==='newtag')&&c?.tags.some(x=>x===v&&x!==tag))return;
 if(kind==='cat'&&c)c.name=v;
 if(kind==='tag'&&c){c.tags=c.tags.map(t=>t===tag?v:t);piRenameTagReferences(tag,v)}
 if(kind==='newcat')piTags.push({id:'user_'+Date.now(),name:v,fixed:false,tags:[]});
 if(kind==='newtag'&&c)c.tags.push(v);
 piInlineEdit=null;piSaveTags();
}
function piRenameTagReferences(oldName,newName){
 Object.values(piItemMeta).forEach(m=>m.tags=(m.tags||[]).map(t=>t===oldName?newName:t));
 Object.keys(piCoordTags).forEach(k=>piCoordTags[k]=(piCoordTags[k]||[]).map(t=>t===oldName?newName:t));
 piTagSelected=piTagSelected.map(t=>t===oldName?newName:t);
 piCoordTagSelected=piCoordTagSelected.map(t=>t===oldName?newName:t);
 piSaveMeta();piSaveCoordTags();
}
function piDeleteTagReferences(name){

}

 state.colorArrange=true;const ordered=pdQrColorOrder(state,it);const previousBody=document.getElementById('pd-qr-body');const oldScroll=previousBody?.scrollTop||0,oldColorScroll=previousBody?.querySelector('.pd-qr-colors')?.scrollLeft||0;

 '<div class="pd-qr-section"><div class="pd-qr-color-heading"><h3>カラータグ</h3></div><div class="pd-qr-colors">'+ordered.map(name=>{const color=COLORS.find(x=>x[0]===name)?.[1]||'#fff';return '<button data-pdqr="color" data-pdqr-drag="move" data-color="'+esc(name)+'" class="'+(colors.includes(name)?'active':'')+'" '+'draggable="true"'+'><span class="pd-qr-check">'+(colors.includes(name)?'✓':'□')+'</span><span class="pd-qr-swatch" style="background:'+color+'"></span>'+esc(name)+'</button>'}).join('')+'</div>'+'<small class="pd-qr-sort-hint">長押ししてドラッグすると順番を変更できます。</small>'+'</div>'+

 const gearPopup=document.querySelector('#pd-qr-body .pd-gear-popover');const gearHead=document.querySelector('#pd-qr-body .pd-qr-imageheads');if(gearPopup&&gearHead)gearHead.appendChild(gearPopup);

function pdQrColorOrder(state,it){
 const names=COLORS.map(x=>x[0]),current=state.colorOrder[state.cat]||it.rank||[];
 return [...new Set([...current.filter(n=>names.includes(n)),...names])];
}
async function pdQrAnalyzeColor(state,cat){
 const it=state.items[cat];if(!it||it.manualColors)return;
 const r=pdRecord(state.id);if(!r)return;
 const score=new Map(COLORS.map(([n])=>[n,0]));
 for(const [n] of COLORS)if((r.name||'').includes(n))score.set(n,10000);
 if(it.image){try{
  const bitmap=await createImageBitmap(await blob(it.image));const cv=document.createElement('canvas');cv.width=cv.height=48;
  const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,48,48);bitmap.close();
  const data=ctx.getImageData(0,0,48,48).data;
  for(let j=0;j<data.length;j+=16){if(data[j+3]<128||data[j]>247&&data[j+1]>247&&data[j+2]>247)continue;
   let best='',distance=Infinity;for(const [n,hex] of COLORS){const rgb=[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16));const d=rgb.reduce((a,v,k)=>a+(v-data[j+k])**2,0);if(d<distance){distance=d;best=n}}
   score.set(best,score.get(best)+1)
  }
 }catch(e){console.warn('QR popup color analysis:',e)}}
 const rank=[...score].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);it.rank=rank;it.colors=rank.slice(0,2);
 state.colorOrder[cat]=rank;state.items[cat]=it;
}
function pdQrMoveColor(state,name,toName){
 const order=pdQrColorOrder(state,state.items[state.cat]||{}),from=order.indexOf(name),to=order.indexOf(toName);
 if(from<0||to<0||from===to)return;order.splice(from,1);order.splice(to,0,name);
 state.colorOrder[state.cat]=order;const it=state.items[state.cat]||{colors:[]};it.rank=order;it.manualColors=true;state.items[state.cat]=it;pdQrRender();
}
async function pdQrChoose(kind){
 const state=pdQrState;if(!state||pdQrBusy)return;
 const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{
  const f=input.files?.[0];if(!f||!pdQrState)return;pdQrBusy=true;
  try{const optimized=await optimizeImage(f,kind==='qr'?1800:1400),id=await store(optimized);const it=pdQrState.items[pdQrState.cat]||{colors:[]};
   if(kind==='image'){it.image=id;it.manualColors=false}else{it.qrPhoto=id;it.qrDigital=null;it.qrPayload=null;it.qrError='';try{const v=await readQR(id);if(v){it.qrDigital=await makeQR(v);it.qrPayload=v;it.checked=true}}catch(e){console.warn('QR decode',e)}}
   pdQrState.items[pdQrState.cat]=it;if(kind==='image')await pdQrAnalyzeColor(pdQrState,pdQrState.cat);pdQrRender();
  }catch(e){alert('画像の保存に失敗しました。'+(e?.message||''))}finally{pdQrBusy=false}
 };input.click();
}
function pdQrHandle(b){if(!pdQrState)return;const a=b.dataset.pdqr,s=pdQrState;if(a==='close'){pdQrClose();return}if(a==='cat'){s.cat=b.dataset.cat;pdQrRender();return}if(a==='settings'){s.settings=!s.settings;pdQrRender();return}if(a==='arrange'){s.colorArrange=!s.colorArrange;pdQrRender();return}if(a==='move'){const order=pdQrColorOrder(s,s.items[s.cat]||{}),i=order.indexOf(b.dataset.color);if(i>0)pdQrMoveColor(s,b.dataset.color,order[i-1]);return}if(a==='image'||a==='qr'){pdQrChoose(a);return}if(a==='color'){const it=s.items[s.cat]||{colors:[]},colors=new Set(it.colors||[]),c=b.dataset.color;colors.has(c)?colors.delete(c):colors.add(c);it.colors=[...colors];it.manualColors=true;s.items[s.cat]=it;pdQrRender();return}if(a==='save'){if(pdQrBusy)return;const records=parse(S,[]),idx=records.findIndex(r=>r.id===s.id);if(idx<0){alert('元のコーデが見つかりません');return}records[idx]={...records[idx],items:{...records[idx].items,...s.items}};try{localStorage.setItem(S,JSON.stringify(records));const id=s.id;pdQrClose();pdShow(id,true);pdNotify('登録内容を保存しました')}catch(e){alert('保存に失敗しました。端末の空き容量を確認してください')}return}}

function variantGroupMembers(records, targetId){
 const ids=new Set([targetId]);let changed=true;
 while(changed){changed=false;for(const r of records){
  if(!r.id)continue;
  const linked=[r.id,r.variantParentId].filter(Boolean);
  if((linked.some(id=>ids.has(id)))&&linked.some(id=>!ids.has(id))){
   linked.forEach(id=>ids.add(id));changed=true;
  }
 }}
 const groupIds=new Set(records.filter(r=>ids.has(r.id)&&r.variantGroupId).map(r=>r.variantGroupId));
 if(groupIds.size){let again=true;while(again){again=false;for(const r of records){
  if(r.variantGroupId&&groupIds.has(r.variantGroupId)&&!ids.has(r.id)){
   ids.add(r.id);again=true;
   if(r.variantParentId)ids.add(r.variantParentId);
  }
 }}}
 return records.filter(r=>ids.has(r.id));
}
function variantGroupId(records,targetId){

}

.registration-fixed .new-reg .reg-body{

 border-radius:var(--pc-radius-slot)!important;

.registration-fixed .new-reg .reg-footer .game-button,
.ie-save{

.ie-backdrop{background:rgba(75,39,65,.57)}
.ie-modal{
 border-color:var(--pc-outline-strong);
 border-radius:var(--pc-radius-panel);
 background:var(--pc-surface);
 color:var(--pc-ink);
 box-shadow:0 12px 36px rgba(91,43,75,.25);
}
.ie-header,.ie-footer{background:var(--pc-surface);border-color:var(--pc-outline-strong)}
.ie-header strong{color:var(--pc-heading)}
.ie-close{
 border-color:var(--pc-secondary-outline);
 border-radius:12px;
 background:var(--pc-soft);
 color:var(--pc-secondary-ink);
}
.ie-scroll{background:var(--pc-surface)}
.ie-media button{

 background:var(--pc-surface-soft);
 color:var(--pc-heading);

.ie-tag-group h4{color:var(--pc-ink)}

 color:var(--pc-secondary-ink);
}
.ie-chip.on{

 border-color:var(--pc-pink-shadow);
 color:white;
}
.ie-add{border-style:dashed;background:var(--pc-surface)}
.ie-memo{border-color:var(--pc-secondary-outline);color:var(--pc-ink);background:white}
.ie-mark{border-color:var(--pc-secondary-outline);color:var(--pc-secondary-ink)}
.ie-mark.on{background:var(--pc-pink);border-color:var(--pc-pink-shadow);color:white}
.ie-save{outline:none!important;min-height:49px}

.ie-add:focus-visible,.ie-memo:focus-visible,.ie-save:focus-visible,

<script id="pricoletta-scroll-stability">
/* Preserve the position of scrollable panels when an in-place UI action redraws them.
   A genuine page/view change is not restored. No stored outfit/QR data is changed. */
(()=>{
  const roots=()=>[document.querySelector('#content'),document.querySelector('main')].filter(Boolean);
  const signature=()=>{
    const el=document.querySelector('#content')||document.querySelector('main');
    if(!el)return '';
    const title=el.querySelector('h1,h2')?.textContent?.trim()||'';
    const mode=el.classList.contains('pi-items-mode')?'items':el.classList.contains('pi-page')?'coordinates':'other';
    return title+'|'+mode;
  };
  function path(el,root){
    const parts=[];
    for(let n=el;n&&n!==root;n=n.parentElement){
      const p=n.parentElement;
      if(!p)return '';
      const index=Array.prototype.indexOf.call(p.children,n);
      parts.unshift(index);
    }
    return parts.join('.');
  }
  function findPath(root,key){
    let n=root;
    for(const part of key.split('.')){
      if(!n)return null;
      n=n.children[Number(part)];
    }
    return n;
  }
  function snapshot(){
    const root=document.querySelector('#content')||document.querySelector('main');
    if(!root)return null;
    const nodes=[];
    for(const el of root.querySelectorAll('*')){
      if(el.scrollTop===0&&el.scrollLeft===0)continue;
      if(el.scrollHeight<=el.clientHeight+2&&el.scrollWidth<=el.clientWidth+2)continue;
      nodes.push({node:el,key:path(el,root),tag:el.tagName,cls:el.className instanceof SVGAnimatedString?'':String(el.className||''),top:el.scrollTop,left:el.scrollLeft});
    }
    return {root,signature:signature(),nodes};
  }
  function restore(snap){
    if(!snap||signature()!==snap.signature)return;
    for(const x of snap.nodes){
      if(x.node.isConnected)continue; // Existing panels retain their own scroll state.
      let target=findPath(snap.root,x.key);
      if(!target||target.tagName!==x.tag||String(target.className||'')!==x.cls){
        const classes=x.cls.split(/\s+/).filter(Boolean);
        if(classes.length){
          try{
            const matches=Array.from(snap.root.querySelectorAll(classes.map(c=>'.'+CSS.escape(c)).join('')));
            target=matches.length===1?matches[0]:null;
          }catch(_){target=null}
        }else target=null;
      }
      if(!target)continue;
      if(target.scrollHeight>target.clientHeight+2)target.scrollTop=x.top;
      if(target.scrollWidth>target.clientWidth+2)target.scrollLeft=x.left;
    }
  }
  let active=null;
  function begin(){
    if(active)return;
    const snap=snapshot();
    if(!snap)return;
    active=snap;
    // Run after synchronous click/pointer/input handlers and DOM replacement.
    setTimeout(()=>{if(active===snap){restore(snap);active=null}},0);
  }
  document.addEventListener('click',begin,true);
  document.addEventListener('input',begin,true);
  document.addEventListener('change',begin,true);
  document.addEventListener('pointerup',begin,true);
})();
</script>
