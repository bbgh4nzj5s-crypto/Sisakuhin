<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), content=$('#page-content'), heading=$('#page-heading');
const K='pricoletta_draft_v2',S='pricoletta_records_v2',D='pricoletta_assets_v2',STORE='assets';

"アクセ":"<path d=\"m3 9 4 3 5-7 5 7 4-3-2 10H5L3 9Z\"/><path d=\"M5 22h14\"/>",
"トップス":"<path d=\"m8 4-5 4-1 6 5 2 1-3v9h8v-9l1 3 5-2-1-6-5-4-2 3h-2l-2-3Z\"/>",
"ボトムス":"<path d=\"M8 3h8l4 18H4L8 3Z\"/><path d=\"M7 7h10\"/>",
"ワンピース":"<path d=\"m9 3-2 3-3 1-1 5 4 1 1-3v3L4 21h16l-4-8v-3l1 3 4-1-1-5-3-1-2-3-3 3-3-3Z\"/>",
"シューズ":"<path d=\"M3 15c3 0 5-3 7-7l3 1c1 4 3 5 8 6v4H3v-4Z\"/><path d=\"M3 16h18\"/>"};return '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+(paths[cat]||'<path d="M12 21 3 12 12 3l9 9-9 9Z"/>')+'</svg>'}

function openDB(){if(db)return Promise.resolve(db);return new Promise((ok,no)=>{const r=indexedDB.open(D,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)})}
async function toDataURL(value){return new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=()=>no(reader.error||new Error('FileReader failed'));reader.readAsDataURL(value)})}

async function fallbackImage(original){
  // Reduce image size for Safari environments where IndexedDB is unavailable.
  try{
    const objectUrl=URL.createObjectURL(original);
    try{
      const image=await new Promise((ok,no)=>{const img=new Image();img.onload=()=>ok(img);img.onerror=()=>no(new Error('画像形式を読み込めません'));img.src=objectUrl});
      const ratio=Math.min(1,800/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
      const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);

async function store(value){
  const id=crypto.randomUUID();
  try{
    const d=await openDB();

    catch(fallbackError){const err=new Error('画像保存領域を利用できません。Safariの通常タブで開き、サイトのストレージ設定・空き容量を確認してください。');err.name='StorageUnavailable';err.cause=fallbackError;throw err}
  }
}
async function blob(id){
  if(!id)return null;
  try{const d=await openDB();const value=await new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)});if(value)return value}catch(e){console.warn('IndexedDB read failed',e)}

function revoke(){urls.forEach(URL.revokeObjectURL);urls=[]}
function pages(key){content.classList.remove('registration-fixed');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key));revoke();heading.textContent={home:'ホーム',items:'コーデアイテム',register:'アイテムを登録',dressup:'きせかえ',extra:'？？？'}[key];if(key==='home')content.innerHTML='<h1 class="page-title">♡ ホーム ♡</h1><p class="page-sub">プリコレッタへようこそ！</p><div class="menu-stack">'+[['items','コーデアイテム'],['register','アイテムを登録'],['dressup','きせかえ'],['extra','？？？']].map(x=>'<button class="game-button" data-go="'+x[0]+'">'+x[1]+' →</button>').join('')+'</div>';
else if(key==='register')content.innerHTML='<h1 class="page-title">♡ アイテムを登録 ♡</h1><p class="page-sub">登録方法をえらんでね</p><div class="registration-list">'+[['single','ひとつずつ登録','アイテムを1つずつ登録する'],['batch','まとめて登録','同じコーデのアイテムをまとめて登録する'],['pro','まとめて登録 Pro','異なるコーデのアイテムもまとめて登録する（上級者向け）']].map(x=>'<button class="registration-option" data-method="'+x[0]+'"><span class="registration-name">'+x[1]+' ›</span><span class="registration-description">'+x[2]+'</span></button>').join('')+'<div class="registration-unavailable">URLから登録<br><small>現在、この機能はご利用いただけません。</small></div></div>';

if(draft.step===3){const i=item(draft.cat);shell('<div class="reg-fixed new-reg"><div class="reg-top"><div class="reg-page-title">アイテム登録<small>画像・QR・カラーをカテゴリごとに設定するよ。</small></div><div class="category-tabs">'+CATS[draft.type].map(c=>'<div class="category-choice"><button class="category-name '+(draft.cat===c?'active':'')+'" data-cat="'+esc(c)+'"><span class="cat-icon">'+categoryIcon(c)+'</span>'+esc(c)+'</button><span class="category-state '+statusClass(c)+'">'+statusSymbol(c)+' '+status(c)+'</span></div>').join('')+'</div></div><div class="reg-body"><div class="item-heading"><strong><span class="cat-icon">'+categoryIcon(draft.cat)+'</span>'+esc(draft.cat)+'</strong><span class="status '+statusClass(draft.cat)+'">'+statusSymbol(draft.cat)+' '+status(draft.cat)+'</span><button type="button" class="qr-settings-button'+(i.checked||i.commonFull||i.commonTB?' configured':'')+'" data-act="qr-settings" aria-label="QR設定を開く" aria-expanded="false">⚙</button></div><div class="image-grid"><div class="slot" data-slot="image"><span data-preview="image">＋ アイテム画像</span></div><div class="slot" data-slot="qr"><span data-preview="qr">＋ QR画像</span></div></div><div id="qr-settings-panel" class="qr-settings-panel" hidden><div class="qr-settings-head"><strong>QR設定</strong><button type="button" data-act="qr-settings-close" aria-label="閉じる">×</button></div><label class="check"><input id="registered" type="checkbox" '+(i.checked?'checked':'')+'> QRを登録済みにする</label><p class="qr-settings-caption">共通QR（どちらか1つ）</p><label class="check"><input data-common="full" type="checkbox" '+(i.commonFull?'checked':'')+'> フルコーデが共通のQR</label>'+(draft.type==='separate'?'<label class="check"><input data-common="tb" type="checkbox" '+(i.commonTB?'checked':'')+'> トップス＆ボトムスが共通のQR</label>':'')+'</div>'+(i.qrError?'<p class="error reg-qr-error">'+esc(i.qrError)+'</p>':'')+'<div class="reg-colors-heading">カラータグ <small>横にスワイプ</small></div><div class="colors" id="colors"></div></div><div class="reg-tray-area"><div class="reg-tray-heading"><strong>未配置の画像</strong><small>画像を選択 → 上の枠をタップ</small></div><div class="reg-tray-row"><button class="reg-tray-add" data-act="add" aria-label="未配置画像を追加">＋<small>画像追加</small></button><div class="tray" id="tray"></div></div></div><div class="reg-footer"><button class="reg-back" data-act="back">‹ ひとつ前にもどる</button>'+btn('保存先を選ぶ →','destination')+'</div></div>');return}
if(draft.step===4){shell('<h2>保存先を選択 ♡</h2>'+['グループ1','グループ2','グループ3'].map(n=>'<label class="check"><input type="radio" name="destination" value="'+n+'" '+(draft.destination===n?'checked':'')+'> '+n+'</label>').join('')+btn('確認へ →','confirm'));return}

function suggest(){const box=$('#name-hints');if(!box)return;const q=draft.name.toLowerCase();const old=parse('pricoletta_coordinate_names',[]);const names=[...new Set([...parse(S,[]).map(r=>r.name),...old])].filter(n=>n.toLowerCase().includes(q)&&n!==draft.name&&q).slice(0,5);box.innerHTML=names.map(n=>'<button data-suggest="'+esc(n)+'">'+esc(n)+'</button>').join('')}
function colors(){const box=$('#colors');if(!box)return;const i=item(draft.cat),order=i.rank?.length?i.rank:COLORS.map(c=>c[0]);box.innerHTML=order.map(n=>'<label class="color"><input type="checkbox" data-color="'+n+'" '+(i.colors.includes(n)?'checked':'')+'><span class="color-dot" style="background:'+COLORS.find(c=>c[0]===n)[1]+'"></span><small>'+n+'</small></label>').join('')}
async function trayPreview(id){
  const original=await blob(id);if(!original)return '';
  try{
    const bitmap=await createImageBitmap(original), max=440, ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bitmap.width*ratio));cv.height=Math.max(1,Math.round(bitmap.height*ratio));
    const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,cv.width,cv.height);bitmap.close();
    const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;
    const alphaCorners=[0,(w-1)*4,(h-1)*w*4,(h*w-1)*4];
    const hasTransparency=alphaCorners.some(j=>d[j+3]<32);
    // Only trim white when the entire outer edge is almost white. Avoid removing white details from artwork.
    let whiteEdge=!hasTransparency;
    if(whiteEdge){for(let x=0;x<w;x+=Math.max(1,Math.floor(w/16))){for(const y of [0,h-1]){const j=(y*w+x)*4;if(d[j]<248||d[j+1]<248||d[j+2]<248){whiteEdge=false;break}}if(!whiteEdge)break}}
    if(whiteEdge){for(let y=0;y<h;y+=Math.max(1,Math.floor(h/16))){for(const x of [0,w-1]){const j=(y*w+x)*4;if(d[j]<248||d[j+1]<248||d[j+2]<248){whiteEdge=false;break}}if(!whiteEdge)break}}
    let left=w,top=h,right=-1,bottom=-1;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const j=(y*w+x)*4;const visible=hasTransparency?d[j+3]>=32:(whiteEdge?(d[j]<242||d[j+1]<242||d[j+2]<242):true);if(visible){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x);bottom=Math.max(bottom,y)}}
    if(right<left||bottom<top)return url(id);
    const pad=Math.max(3,Math.round(Math.max(right-left,bottom-top)*.04));left=Math.max(0,left-pad);top=Math.max(0,top-pad);right=Math.min(w-1,right+pad);bottom=Math.min(h-1,bottom+pad);
    if((right-left+1)*(bottom-top+1)>w*h*.9)return url(id);
    const out=document.createElement('canvas');out.width=right-left+1;out.height=bottom-top+1;out.getContext('2d').drawImage(cv,left,top,out.width,out.height,0,0,out.width,out.height);
    const cropped=await new Promise(ok=>out.toBlob(ok,'image/png'));if(!cropped)return url(id);
    const u=URL.createObjectURL(cropped);urls.push(u);return u;
  }catch(e){console.warn('preview crop skipped',e);return url(id)}
}
async function hydrate(){const serial=++hydrateSerial;if(draft.step===3){colors();const tray=$('#tray');if(tray){tray.innerHTML=draft.unplaced.length?'':'<span class="hint">画像を追加してね</span>';for(const id of [...new Set(draft.unplaced)]){const u=await trayPreview(id);if(serial!==hydrateSerial||!tray.isConnected)return;const el=document.createElement('div');el.className='tray-img'+(selectedTray===id?' tray-selected':'');el.dataset.tray=id;el.innerHTML='<img src="'+u+'" alt="未配置画像"><button class="remove" data-remove-tray="'+id+'" aria-label="未配置から削除">×</button>';tray.append(el)}}}
for(const slot of content.querySelectorAll('[data-preview]')){const kind=slot.dataset.preview,i=item(draft.cat),id=kind==='image'?i.image:kind==='qr'?(i.qrDigital||i.qrPhoto):draft[kind];if(!id)continue;const u=await url(id);if(serial!==hydrateSerial||!slot.isConnected)return;slot.innerHTML='<img src="'+u+'" alt="登録済み画像">';const parent=slot.closest('[data-slot]');if(parent&&!parent.querySelector('.remove')){const b=document.createElement('button');b.className='remove';b.textContent='×';b.title='画像を未配置へ戻す';b.dataset.return=kind;parent.append(b)}}}
async function analyze(cat){const i=item(cat);if(i.manualColors)return;const score=new Map(COLORS.map(([n])=>[n,0]));for(const [n] of COLORS)if(draft.name.includes(n))score.set(n,10000);if(i.image){try{const b=await blob(i.image),bitmap=await createImageBitmap(b),cv=document.createElement('canvas');cv.width=cv.height=48;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,48,48);bitmap.close();const data=ctx.getImageData(0,0,48,48).data;for(let j=0;j<data.length;j+=16){if(data[j+3]<128)continue;if(data[j]>247&&data[j+1]>247&&data[j+2]>247)continue;let best='',dist=Infinity;for(const [n,hex] of COLORS){const rgb=[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16));const d=rgb.reduce((s,v,k)=>s+(v-data[j+k])**2,0);if(d<dist){dist=d;best=n}}score.set(best,score.get(best)+1)}}catch(e){console.warn(e)}}i.rank=[...score].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);i.colors=i.rank.slice(0,2);saveDraft();colors()}
async function readQR(id){const b=await blob(id),bitmap=await createImageBitmap(b);try{if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const results=await detector.detect(bitmap);if(results[0]?.rawValue)return results[0].rawValue}catch(e){console.warn(e)}}if(typeof jsQR==='function'){const cv=document.createElement('canvas');const max=1200,ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));cv.width=Math.round(bitmap.width*ratio);cv.height=Math.round(bitmap.height*ratio);const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,cv.width,cv.height);const d=ctx.getImageData(0,0,cv.width,cv.height);return jsQR(d.data,d.width,d.height)?.data||null}return null}finally{bitmap.close()}}
async function makeQR(payload){if(typeof qrcode!=='function')throw Error('QR生成ライブラリを読み込めませんでした');const q=qrcode(0,'M');q.addData(payload);q.make();const n=q.getModuleCount(),scale=8,pad=4,cv=document.createElement('canvas');cv.width=cv.height=(n+pad*2)*scale;const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='black';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+pad)*scale,(y+pad)*scale,scale,scale);const b=await new Promise(ok=>cv.toBlob(ok,'image/png'));return store(b)}
async function assign(id,kind){if(['thumbnail','full'].includes(kind)){if(draft[kind])draft.unplaced.push(draft[kind]);draft[kind]=id}else{const i=item(draft.cat);if(kind==='image'){if(i.image)draft.unplaced.includes(i.image)||draft.unplaced.push(i.image);i.image=id;i.manualColors=false;await analyze(draft.cat)}else{if(i.qrPhoto)draft.unplaced.includes(i.qrPhoto)||draft.unplaced.push(i.qrPhoto);i.qrPhoto=id;i.qrDigital=null;i.qrPayload=null;i.qrError='';let value=null;try{value=await readQR(id)}catch(e){console.warn('QR decode failed',e)}if(value){try{i.qrDigital=await makeQR(value);i.qrPayload=value;i.checked=true}catch(e){i.qrError='QRは読み取れましたがデジタル化に失敗しました。チェックは自動変更していません。'}}else i.qrError='QRを読み取れませんでした。元の写真は保存しています。'}}draft.unplaced=draft.unplaced.filter(x=>x!==id);saveDraft()}
async function returnSlot(kind){const i=item(draft.cat);if(kind==='image'){if(i.image)draft.unplaced.includes(i.image)||draft.unplaced.push(i.image);i.image=null}else if(kind==='qr'){if(i.qrPhoto)draft.unplaced.includes(i.qrPhoto)||draft.unplaced.push(i.qrPhoto);i.qrPhoto=null;i.qrDigital=null;i.qrPayload=null;i.qrError=''}else{if(draft[kind])draft.unplaced.push(draft[kind]);draft[kind]=null}saveDraft();render()}
async function optimizeImage(file,maxSide){
  // iOS photos can be very large. Keep the original when decoding is unsupported.
  if(file.size<1100000)return file;
  try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bitmap.width*scale));cv.height=Math.max(1,Math.round(bitmap.height*scale));cv.getContext('2d').drawImage(bitmap,0,0,cv.width,cv.height);bitmap.close();const compressed=await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',.88));return compressed&&compressed.size<file.size?compressed:file}catch(e){console.warn('image optimization skipped',e);return file}
}
async function upload(kind){const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=kind==='tray';input.onchange=async()=>{if(!input.files?.length)return;try{for(const f of input.files){if(!f.type.startsWith('image/'))continue;const optimized=await optimizeImage(f,kind==='qr'?1800:1400);const id=await store(optimized);if(kind==='tray')draft.unplaced.push(id);else await assign(id,kind)}saveDraft();render()}catch(e){console.error('image save',e);alert('画像を保存できませんでした。'+(e?.message||e?.name||'保存領域のエラー')+'。')}};input.click()}
let selectedTray=null;
function chooseTray(id){selectedTray=id;document.querySelectorAll("[data-tray]").forEach(el=>el.classList.toggle("tray-selected",el.dataset.tray===id));document.querySelectorAll("[data-slot]").forEach(el=>el.classList.toggle("slot-target",["image","qr"].includes(el.dataset.slot)));}
function save(){const recs=parse(S,[]);const id=draft.existingId||crypto.randomUUID(),entry={id,name:draft.name,type:draft.type,items:draft.items,thumbnail:draft.thumbnail,full:draft.full,destination:draft.destination,updatedAt:new Date().toISOString()};const pos=recs.findIndex(r=>r.id===id);if(pos>=0)recs[pos]=entry;else recs.push(entry);try{localStorage.setItem(S,JSON.stringify(recs));const names=[...new Set([draft.name,...parse('pricoletta_coordinate_names',[])])];localStorage.setItem('pricoletta_coordinate_names',JSON.stringify(names));localStorage.removeItem(K);draft=fresh();alert('保存しました ♡');pages('items')}catch(e){alert('保存に失敗しました。端末の空き容量を確認してね')}}
function start(){draft=parse(K,fresh());if(!draft?.items||!Array.isArray(draft.unplaced))draft=fresh();render()}
$('#start-button').addEventListener('click',()=>{$('#title-screen').classList.add('hidden');$('#main-screen').classList.remove('hidden');pages('home')});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>pages(b.dataset.page)));
content.addEventListener('input',e=>{if(e.target.id==='name'){draft.name=e.target.value;saveDraft();suggest()}});
content.addEventListener('change',e=>{if(e.target.dataset.common){const i=item(draft.cat);const key=e.target.dataset.common==='full'?'commonFull':'commonTB';i[key]=e.target.checked;if(e.target.checked)i[key==='commonFull'?'commonTB':'commonFull']=false;saveDraft();render();return}if(e.target.id==='registered'){item(draft.cat).checked=e.target.checked;saveDraft();render()}else if(e.target.matches('[data-color]')){const i=item(draft.cat),c=e.target.dataset.color;i.manualColors=true;i.colors=e.target.checked?[...new Set([...i.colors,c])]:i.colors.filter(x=>x!==c);saveDraft()}else if(e.target.name==='type'){draft.type=e.target.value;if(draft.type==='dress')for(const v of Object.values(draft.items))v.commonTB=false;saveDraft()}else if(e.target.name==='destination'){draft.destination=e.target.value;saveDraft()}});
content.addEventListener('click',async e=>{if(suppressTap){suppressTap=false;return}if(busy)return;const b=e.target.closest('button,[data-slot],[data-tray]');if(!b)return;if(b.dataset.go){pages(b.dataset.go);return}if(b.dataset.method){if(b.dataset.method==='single')start();else{heading.textContent=b.dataset.method==='batch'?'まとめて登録':'まとめて登録 Pro';content.innerHTML='<button class="back-to-registration" data-go="register">‹ 登録方法にもどる</button><div class="placeholder">この登録方法は今後実装予定です。</div>'}return}if(b.dataset.cat){selectedTray=null;draft.cat=b.dataset.cat;render();return}if(b.dataset.suggest){draft.name=b.dataset.suggest;render();return}if(b.dataset.existing){const r=parse(S,[]).find(x=>x.id===b.dataset.existing);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destination,existingId:r.id,step:2};render()}return}if(b.dataset.open){const r=parse(S,[]).find(x=>x.id===b.dataset.open);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destination,existingId:r.id,step:3};render()}return}if(b.dataset.removeTray){if(selectedTray===b.dataset.removeTray)selectedTray=null;draft.unplaced=draft.unplaced.filter(x=>x!==b.dataset.removeTray);saveDraft();render();return}if(b.dataset.return){await returnSlot(b.dataset.return);return}if(b.dataset.tray){chooseTray(b.dataset.tray);return}if(b.dataset.slot){if(selectedTray&&draft.unplaced.includes(selectedTray)&&['image','qr'].includes(b.dataset.slot)){const chosen=selectedTray;selectedTray=null;try{await assign(chosen,b.dataset.slot);render()}catch(e){alert('画像を配置できませんでした')}return}upload(b.dataset.slot);return}const a=b.dataset.act;if(!a)return;if(a==='qr-settings'){const p=$('#qr-settings-panel');if(p){p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))}return}if(a==='qr-settings-close'){$('#qr-settings-panel').hidden=true;return}if(a==='exit'){pages('register');return}if(a==='back'){draft.step=Math.max(0,draft.step-1);render();return}if(a==='name'){draft.name=$('#name')?.value.trim()||'';if(!draft.name){alert('コーデ名を入力してね');return}draft.step=1}else if(a==='new'){draft.existingId=null;draft.items={};draft.step=2}else if(a==='items'){draft.step=3;draft.cat=CATS[draft.type][0];for(const c of CATS[draft.type]){const i=item(c);if(!i.manualColors&&!i.image&&!i.colors.length){i.rank=COLORS.map(x=>x[0]);const names=COLORS.filter(x=>draft.name.includes(x[0])).map(x=>x[0]);if(names.length){i.rank=[...names,...i.rank.filter(x=>!names.includes(x))];i.colors=names.slice(0,2)}}}}else if(a==='destination')draft.step=4;else if(a==='confirm')draft.step=5;else if(a==='save'){save();return}else if(a==='add'){upload('tray');return}render()});
// iOS: disable pointer-drag ghost to prevent overlapping image previews; tap thumbnail, then destination slot.
window.addEventListener('pagehide',saveDraft);
})();
