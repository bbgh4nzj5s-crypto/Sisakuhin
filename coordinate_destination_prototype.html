<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>コーデ登録｜保存先</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#6c4b60;background:#fff7fc}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;padding:20px 15px 110px}.heading{text-align:center;color:#a75493;font-weight:800;font-size:26px}.hint{text-align:center;color:#ad8baa;font-size:13px;margin:6px 0 22px}.steps{display:flex;gap:5px;margin-bottom:20px}.step{flex:1;background:#f4e7f2;border-radius:35px;text-align:center;padding:13px 2px;font-size:14px}.step.active{background:#f4a4d5}.panel{border:2px solid #f3b9dc;background:white;border-radius:25px;padding:16px}.panel h2{font-size:21px;color:#a75493;margin:0 0 12px}.note{font-size:13px;line-height:1.6;color:#777;margin-bottom:15px}.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.listhead strong{font-size:20px;color:#87546e}.linkbtn{border:0;background:transparent;color:#a65d91;font-size:14px;padding:10px;cursor:pointer}.group{border:1px solid #efc9de;border-radius:16px;overflow:hidden;margin:9px 0}.gtitle{display:flex;align-items:center;gap:8px;padding:13px 12px;color:#99507d;background:#fff;font-size:17px;cursor:pointer}.group.open{border:2px solid #e27ab7}.group.open .gtitle{background:#fbe4f1}.gtitle .grow{flex:1}.folders{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.folder{background:#d8f4fc;border:2px solid transparent;color:#229fc4;border-radius:13px;min-height:54px;font-size:13px;cursor:pointer;position:relative;overflow-wrap:anywhere}.folder.selected{border-color:#36b6e2}.folder.selected:after{content:'✓';position:absolute;right:1px;top:1px;color:white;background:#32b2d1;border-radius:50%;padding:0 4px}.direct{grid-column:1/-1;border:1px solid #ece5e9;background:#f7f5f7;border-radius:12px;padding:12px;text-align:left;color:#985a83;cursor:pointer}.direct.selected{outline:2px solid #e38bbb}.addfolder{background:#eefbff;border:1px dashed #8ad6ea}.addgroup{width:100%;border:1px solid #d9cbd5;background:#fff9fd;border-radius:18px;padding:13px;color:#745a6b;font-size:15px;margin-top:10px}.summary{border:2px solid #e881bb;border-radius:20px;padding:13px;margin:20px 0 12px}.summary small{display:block;color:#777;margin-bottom:5px}.summary strong{font-size:18px}.confirm{background:#191919;color:white;border:0;border-radius:40px;width:100%;padding:15px;font-size:17px;font-weight:700}.overlay{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.overlay.show{display:flex}.modal{width:min(100%,490px);max-height:84dvh;overflow:auto;border:6px solid #ee87bc;background:#fff8fd;border-radius:30px;padding:16px}.modalheader{display:flex;align-items:center;gap:8px;color:#a34f8b;font-size:20px;font-weight:800}.modalheader span{flex:1}.close{background:none;border:0;font-size:26px;color:#a34f8b}.sub{font-size:12px;color:#94778b;margin:12px 0}.tree{border:1px solid #ecc5da;border-radius:15px;overflow:hidden;background:white}.treegroup{background:#fbe3f1}.treerow{display:flex;align-items:center;gap:7px;padding:10px 9px;min-height:54px}.treerow.folderrow{padding-left:30px;background:#fffafd}.treerow .name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}.treeicon{color:#d75ca5}.folderrow .treeicon{color:#66b6d4}.smallbtn{background:none;border:0;color:#a36b94;font-size:18px;width:34px;height:40px;flex-shrink:0;cursor:pointer}.drag{touch-action:none;cursor:grab;font-size:21px;line-height:1;color:#a36b94;display:flex;align-items:center;justify-content:center;width:36px;height:42px;flex-shrink:0;user-select:none}.drag svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}.drag.active{color:#df4c9c}.treeadd{border:0;background:#fff;color:#35a6c9;text-align:left;padding:12px 30px;width:100%;font-size:14px}.treebottom{padding:12px 0}.treebottom button{width:100%;border:1px solid #dccbd6;border-radius:20px;background:transparent;padding:12px;color:#72576a;font-size:15px}.editbox{border:1px solid #e8b5d3;border-radius:16px;background:white;padding:14px;margin-top:12px}.editbox label{display:block;font-size:14px;margin-bottom:7px}.editbox input{width:100%;padding:11px;border:1px solid #dbbad1;border-radius:9px;font-size:16px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.actions button{border:1px solid #dfb5ce;border-radius:12px;background:#fff;padding:10px;color:#96557e}.actions button.primary{background:#e99ac9;color:#512c47;border:0}.danger{margin-top:14px;border:0;background:transparent;color:#c6506a;padding:8px}.ghost{position:fixed;z-index:30;pointer-events:none;opacity:.92;background:#fff0f8;border:2px solid #df83b5;border-radius:12px;box-shadow:0 5px 16px #0002;padding:12px;font-size:15px}.dragging{opacity:.35}.dropbefore{box-shadow:inset 0 3px #d851a5}.dropafter{box-shadow:inset 0 -3px #d851a5}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#3a2836;color:white;padding:11px 17px;border-radius:20px;font-size:13px;display:none;z-index:40}
</style></head><body><main class="app"><div class="heading">♡ コーデ登録 ♡</div><div class="hint">保存先選択・編集の動作サンプル</div><div class="steps"><div class="step">コーデ</div><div class="step">アイテム</div><div class="step active">保存先</div><div class="step">確認</div></div><section class="panel"><h2>保存先をえらぶ</h2><div class="note">グループに直接保存することも、フォルダに保存することもできます。</div><div class="listhead"><strong>コーデリスト</strong><button class="linkbtn" id="openEditor">編集 ⋯</button></div><div id="picker"></div><button class="addgroup" id="pickerAddGroup">⊞ グループを追加</button><div class="summary"><small>選択した保存先</small><strong id="summary"></strong></div><button class="confirm" id="confirm">この保存先に決定 ♡</button></section></main><div class="overlay" id="overlay"><div class="modal"><div class="modalheader">♡ グループ・フォルダ編集 ♡<span></span><button class="close" id="close">×</button></div><div class="sub">鉛筆で名前変更・削除。右端の三本線を押しながらドラッグして並び替え。</div><div class="tree" id="tree"></div><div class="treebottom"><button id="editorAddGroup">⊞ グループを追加</button></div><div id="editbox"></div></div></div><div class="toast" id="toast"></div><script>
const STORAGE='coordinate-folder-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(STORAGE))}catch{};if(!data||!Array.isArray(data.groups))data={groups:[{id:'g1',name:'グループ1',folders:[{id:'f11',name:'フォルダa1'},{id:'f12',name:'フォルダa2'}]},{id:'g2',name:'グループ2',folders:[1,2,3,4,5].map(i=>({id:'f2'+i,name:'フォルダb'+i}))},{id:'g3',name:'グループ3',folders:[]}],open:['g2'],selected:{gid:'g2',fid:'f22'}};let edit=null,drag=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(STORAGE,JSON.stringify(data));const group=id=>data.groups.find(g=>g.id===id);const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);const menuIcon='<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function render(){renderPicker();renderTree();save()}
function renderPicker(){$('picker').innerHTML=data.groups.map(g=>{let open=data.open.includes(g.id);return `<div class="group ${open?'open':''}"><div class="gtitle" data-toggle="${g.id}"><span>${open?'⌃':'⌄'}</span><span>▱</span><span class="grow">${esc(g.name)}</span></div>${open?`<div class="folders"><button class="direct ${data.selected?.gid===g.id&&!data.selected.fid?'selected':''}" data-pick="${g.id}" data-fid="">◯ このグループに直接保存</button>${g.folders.map(f=>`<button class="folder ${data.selected?.fid===f.id?'selected':''}" data-pick="${g.id}" data-fid="${f.id}">${esc(f.name)}</button>`).join('')}<button class="folder addfolder" data-addfolder="${g.id}">＋ フォルダを追加</button></div>`:''}</div>`}).join('');let g=group(data.selected?.gid),f=g?.folders.find(x=>x.id===data.selected?.fid);$('summary').textContent=g?g.name+(f?' › '+f.name:'（直接保存）'):'未選択'}
function renderTree(){$('tree').innerHTML=data.groups.map(g=>`<div class="treegroup" data-gid="${g.id}"><div class="treerow" data-kind="group" data-id="${g.id}"><button class="smallbtn" data-toggle="${g.id}">${data.open.includes(g.id)?'⌄':'›'}</button><span class="treeicon">▱</span><span class="name">${esc(g.name)}</span><button class="smallbtn" aria-label="グループ名編集" data-edit="group" data-gid="${g.id}">✎</button><div class="drag" data-drag="group" data-id="${g.id}" aria-label="グループをドラッグ">${menuIcon}</div></div>${data.open.includes(g.id)?`<div class="treechildren">${g.folders.map(f=>`<div class="treerow folderrow" data-kind="folder" data-id="${f.id}" data-parent="${g.id}"><span style="color:#b8a0b4">↳</span><span class="treeicon">▱</span><span class="name">${esc(f.name)}</span><button class="smallbtn" aria-label="フォルダ名編集" data-edit="folder" data-gid="${g.id}" data-fid="${f.id}">✎</button><div class="drag" data-drag="folder" data-id="${f.id}" data-parent="${g.id}" aria-label="フォルダをドラッグ">${menuIcon}</div></div>`).join('')}<button class="treeadd" data-addfolder="${g.id}">▱＋ フォルダを追加</button></div>`:''}</div>`).join('')}
function showEditor(){$('overlay').classList.add('show');renderTree();renderEdit()}function hideEditor(){$('overlay').classList.remove('show');edit=null;renderEdit()};function startEdit(kind,gid,fid){let g=group(gid),f=g?.folders.find(x=>x.id===fid);edit={kind,gid,fid};renderEdit(g&&kind==='group'?g.name:f?.name||'')};function renderEdit(value){let e=$('editbox');if(!edit){e.innerHTML='';return}let g=group(edit.gid),f=g?.folders.find(x=>x.id===edit.fid),name=value??(edit.kind==='group'?g?.name:f?.name)??'';e.innerHTML=`<div class="editbox"><label>${edit.kind==='group'?'グループ':'フォルダ'}名を変更</label><input id="nameInput" value="${esc(name)}" maxlength="70"><div class="actions"><button id="cancelEdit">キャンセル</button><button class="primary" id="saveName">変更を保存</button></div><button class="danger" id="deleteItem">🗑 この${edit.kind==='group'?'グループ':'フォルダ'}を削除</button></div>`;$('nameInput').focus()}
function addGroup(){let id=uid();data.groups.push({id,name:'新しいグループ',folders:[]});data.open.push(id);render();showEditor();startEdit('group',id)}function addFolder(gid){let g=group(gid);if(!g)return;let id=uid();g.folders.push({id,name:'新しいフォルダ'});if(!data.open.includes(gid))data.open.push(gid);render();showEditor();startEdit('folder',gid,id)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-toggle],[data-pick],[data-addfolder],[data-edit]');if(t?.dataset.toggle){let id=t.dataset.toggle;data.open=data.open.includes(id)?data.open.filter(x=>x!==id):[...data.open,id];render()}else if(t?.dataset.pick){data.selected={gid:t.dataset.pick,fid:t.dataset.fid||null};renderPicker();save()}else if(t?.dataset.addfolder)addFolder(t.dataset.addfolder);else if(t?.dataset.edit)startEdit(t.dataset.edit,t.dataset.gid,t.dataset.fid);if(e.target.id==='cancelEdit'){edit=null;renderEdit()}if(e.target.id==='saveName'&&edit){let n=$('nameInput').value.trim();if(!n)return toast('名前を入力してね');let g=group(edit.gid);if(edit.kind==='group')g.name=n;else g.folders.find(f=>f.id===edit.fid).name=n;edit=null;renderEdit();render();toast('名前を変更しました')}if(e.target.id==='deleteItem'&&edit){let g=group(edit.gid),f=g?.folders.find(x=>x.id===edit.fid),name=edit.kind==='group'?g?.name:f?.name;let message=edit.kind==='group'?`「${name}」を削除しますか？\nこの試作品ではグループ内のフォルダも削除されます。`:`「${name}」を削除しますか？`;if(!confirm(message))return;if(edit.kind==='group'){data.groups=data.groups.filter(x=>x.id!==edit.gid);if(data.selected?.gid===edit.gid)data.selected=null}else{g.folders=g.folders.filter(x=>x.id!==edit.fid);if(data.selected?.fid===edit.fid)data.selected={gid:g.id,fid:null}}edit=null;renderEdit();render();toast('削除しました')}});
$('openEditor').onclick=showEditor;$('close').onclick=hideEditor;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideEditor()});$('editorAddGroup').onclick=addGroup;$('pickerAddGroup').onclick=addGroup;$('confirm').onclick=()=>toast(data.selected?'保存先を選択しました（サンプル）':'保存先を選択してね');
// Touch/pointer drag sorting: only within the same level; groups carry their folders.
$('tree').addEventListener('pointerdown',e=>{let handle=e.target.closest('[data-drag]');if(!handle)return;e.preventDefault();let row=handle.closest('.treerow');drag={pointer:e.pointerId,kind:handle.dataset.drag,id:handle.dataset.id,parent:handle.dataset.parent||null,handle,row,startY:e.clientY,target:null,after:false};handle.setPointerCapture(e.pointerId);handle.classList.add('active');row.classList.add('dragging');let ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=row.querySelector('.name').textContent;ghost.style.left=Math.max(12,row.getBoundingClientRect().left)+'px';ghost.style.top=(e.clientY-24)+'px';document.body.appendChild(ghost);drag.ghost=ghost});
$('tree').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;drag.ghost.style.top=(e.clientY-24)+'px';document.querySelectorAll('.dropbefore,.dropafter').forEach(el=>el.classList.remove('dropbefore','dropafter'));let rows=[...$('tree').querySelectorAll(`.treerow[data-kind="${drag.kind}"]`)].filter(r=>r.dataset.id!==drag.id&&(drag.kind==='group'||r.dataset.parent===drag.parent));let target=rows.find(r=>{let b=r.getBoundingClientRect();return e.clientY>=b.top&&e.clientY<=b.bottom});if(target){drag.target=target.dataset.id;drag.after=e.clientY>target.getBoundingClientRect().top+target.offsetHeight/2;target.classList.add(drag.after?'dropafter':'dropbefore')}else drag.target=null});
function finishDrag(e){if(!drag||e.pointerId!==drag.pointer)return;let d=drag;drag=null;d.ghost.remove();d.row.classList.remove('dragging');document.querySelectorAll('.dropbefore,.dropafter').forEach(el=>el.classList.remove('dropbefore','dropafter'));if(!d.target)return;let a=d.kind==='group'?data.groups:group(d.parent)?.folders;if(!a)return;let from=a.findIndex(x=>x.id===d.id),to=a.findIndex(x=>x.id===d.target);if(from<0||to<0)return;let [item]=a.splice(from,1);to=a.findIndex(x=>x.id===d.target)+(d.after?1:0);a.splice(to,0,item);render()};$('tree').addEventListener('pointerup',finishDrag);$('tree').addEventListener('pointercancel',e=>{if(drag){drag.ghost.remove();drag=null;renderTree()}});render();
</script></body></html>
