<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff7fc"><title>コーデ登録｜保存先</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#65465b;background:#fff7fc}*{box-sizing:border-box}html,body{height:100%;height:100dvh;margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid #ce66a5;outline-offset:2px}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:#fff7fc}.top{flex:none;padding:12px 15px 9px}.heading{text-align:center;font-size:clamp(21px,5.2vw,28px);font-weight:800;color:#a45190}.hint{text-align:center;color:#ad8baa;font-size:12px;margin:4px 0 12px}.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.step{border-radius:40px;background:#f2e5f0;text-align:center;padding:12px 0;font-size:13px;color:#80617d}.step.active{background:#f3a4d4}.panel{flex:1;min-height:0;margin:8px 13px 6px;border:2px solid #f2badd;border-radius:25px;background:white;display:flex;flex-direction:column;overflow:hidden}.paneltop{flex:none;padding:15px 14px 8px}.panel h2{font-size:21px;color:#a75493;margin:0 0 8px}.note{font-size:12px;color:#777;line-height:1.5;margin:0 0 12px}.listhead{display:flex;justify-content:space-between;align-items:center}.listhead strong{font-size:19px;color:#80516a}.linkbtn{border:0;background:none;color:#a65d91;font-size:14px;display:flex;align-items:center;gap:5px;min-height:40px;padding:5px}.scrollarea{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 12px 14px}.group{border:1px solid #efc9de;border-radius:17px;overflow:hidden;margin:9px 0;background:white}.group.open{border:2px solid #e27ab7}.gtitle{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#fff;padding:13px 11px;color:#99507d;text-align:left;font-size:16px;min-height:54px}.group.open .gtitle{background:#fbe4f1}.gtitle .grow{flex:1}.folders{padding:11px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.folder{background:#d8f4fc;border:2px solid transparent;color:#229fc4;border-radius:13px;min-height:57px;font-size:12px;position:relative;overflow-wrap:anywhere;padding:8px 4px}.folder.selected{border-color:#36b6e2;background:#c9f1fd}.selectedmark{position:absolute;right:2px;top:1px;color:#20a6ca}.direct{grid-column:1/-1;border:1px solid #ece5e9;background:#f7f5f7;border-radius:12px;padding:12px;text-align:left;color:#985a83;display:flex;align-items:center;gap:8px;font-size:13px}.direct.selected{outline:2px solid #e38bbb}.addfolder{background:#eefbff;border:1px dashed #8ad6ea;display:flex;align-items:center;justify-content:center;gap:3px}.addgroup{width:100%;border:1px solid #d9cbd5;background:#fff9fd;border-radius:18px;padding:13px;color:#745a6b;font-size:14px;margin:8px 0 0;display:flex;align-items:center;justify-content:center;gap:7px}.panelbottom{flex:none;padding:10px 13px 14px;border-top:1px solid #f7e6f1}.confirm{background:#191919;color:white;border:0;border-radius:40px;width:100%;min-height:48px;font-size:15px;font-weight:700}.nav{flex:none;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #f2d6e8;background:#fff9fd}.navitem{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:#b79bb1;font-size:10px}.navitem.active{color:#d45aa4;background:#fce8f4;border-radius:22px}.navitem svg{width:24px;height:24px}.overlay{position:fixed;inset:0;z-index:10;background:#0006;display:none;align-items:center;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:min(100%,490px);max-height:min(87dvh,800px);min-height:0;border:5px solid #ee87bc;background:#fff8fd;border-radius:30px;padding:14px;display:flex;flex-direction:column;overflow:hidden}.modalheader{display:flex;align-items:center;gap:6px;color:#a34f8b;font-size:clamp(16px,4.5vw,21px);font-weight:800;flex:none}.modalheader span{flex:1}.close{border:0;background:none;color:#a34f8b;min-width:38px;min-height:38px;display:grid;place-items:center}.sub{font-size:12px;color:#94778b;margin:9px 0 10px;flex:none;line-height:1.5}.modalcontent{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.tree{border:1px solid #ecc5da;border-radius:15px;overflow:hidden;background:white}.treegroup{border-bottom:1px solid #f1d9e7}.treegroup:last-child{border-bottom:0}.treerow{display:flex;align-items:center;gap:5px;padding:6px 8px;min-height:55px;background:#fbe3f1}.treerow.folderrow{padding-left:27px;background:#fffafd}.treerow .name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.treeicon{color:#d75ca5;flex:none}.folderrow .treeicon{color:#66b6d4}.smallbtn{border:0;background:none;color:#a36b94;min-width:35px;min-height:42px;display:grid;place-items:center;padding:0;flex:none}.drag{touch-action:none;cursor:grab;color:#a36b94;display:grid;place-items:center;width:42px;height:44px;flex:none;user-select:none;-webkit-user-select:none}.drag svg{width:23px;height:23px;stroke-width:1.65}.drag.active{color:#df4c9c}.treeadd{border:0;background:#fff;color:#35a6c9;text-align:left;padding:13px 28px;width:100%;font-size:13px;display:flex;gap:7px;align-items:center}.treebottom{padding:12px 0 3px;flex:none}.treebottom button{width:100%;border:1px solid #dccbd6;border-radius:20px;background:transparent;padding:12px;color:#72576a;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:center}.editbox{border:1px solid #e8b5d3;border-radius:16px;background:white;padding:13px;margin-top:10px;flex:none}.editbox label{display:block;font-size:14px;margin-bottom:7px}.editbox input{width:100%;padding:11px;border:1px solid #dbbad1;border-radius:9px;font-size:16px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:11px}.actions button{border:1px solid #dfb5ce;border-radius:12px;background:#fff;padding:10px;color:#96557e;font-size:13px}.actions button.primary{background:#e99ac9;color:#512c47;border:0}.danger{margin-top:10px;border:0;background:transparent;color:#c6506a;padding:10px 2px;display:flex;align-items:center;gap:5px;font-size:13px}.ghost{position:fixed;z-index:30;pointer-events:none;opacity:.94;background:#fff0f8;border:2px solid #df83b5;border-radius:12px;box-shadow:0 5px 16px #0002;padding:12px;font-size:15px}.dragging{opacity:.32}.dropbefore{box-shadow:inset 0 3px #d851a5}.dropafter{box-shadow:inset 0 -3px #d851a5}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#3a2836;color:white;padding:11px 17px;border-radius:20px;font-size:13px;display:none;z-index:40;white-space:nowrap}.choice{padding:18px 5px 12px;text-align:center}.choicepath{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;background:white;border:1px solid #f0d1e5;border-radius:15px;padding:17px 8px;font-weight:700;color:#915278;margin:12px 0 20px}.choiceactions{display:grid;gap:9px}.secondary{border:1px solid #dcbfd2;background:#fff;border-radius:35px;padding:13px;color:#8b6280}.icon{width:19px;height:19px;stroke-width:1.9;vertical-align:middle;flex:none}@media(max-height:680px){.top{padding-top:5px}.hint{margin-bottom:5px}.step{padding:9px 0}.paneltop{padding-top:9px}.note{margin-bottom:5px}.nav{height:calc(57px + env(safe-area-inset-bottom))}}
</style></head><body>
<main class="app"><header class="top"><div class="heading">♡ コーデ登録 ♡</div><div class="hint">入力内容はこの画面内のサンプルです</div><div class="steps"><div class="step">コーデ</div><div class="step">アイテム</div><div class="step active">保存先</div><div class="step">確認</div></div></header><section class="panel"><div class="paneltop"><h2>保存先をえらぶ</h2><p class="note">グループに直接保存することも、フォルダに保存することもできます。</p><div class="listhead"><strong>コーデリスト</strong><button class="linkbtn" id="openEditor"><i data-lucide="pencil" class="icon"></i> 編集</button></div></div><div class="scrollarea" id="pickerScroll"><div id="picker"></div><button class="addgroup" id="pickerAddGroup"><i data-lucide="folder-plus" class="icon"></i>グループを追加</button></div><div class="panelbottom"><button class="confirm" id="confirm">この保存先に決定 ♡</button></div></section><nav class="nav"><div class="navitem"><i data-lucide="house"></i>ホーム</div><div class="navitem"><i data-lucide="shirt"></i>Myクローゼット</div><div class="navitem active"><i data-lucide="square-plus"></i>登録</div><div class="navitem"><i data-lucide="layout-grid"></i>コーデアイテム</div><div class="navitem"><i data-lucide="star"></i>ベスト</div></nav></main>
<div class="overlay" id="editorOverlay"><div class="modal"><div class="modalheader">♡ グループ・フォルダ編集 ♡<span></span><button class="close" id="closeEditor" aria-label="閉じる"><i data-lucide="x"></i></button></div><div class="sub">鉛筆から名前変更・削除。三本線を押さえてドラッグすると並び替えできます。</div><div class="modalcontent" id="editorScroll"><div class="tree" id="tree"></div><div class="treebottom"><button id="editorAddGroup"><i data-lucide="folder-plus" class="icon"></i>グループを追加</button></div></div><div id="editbox"></div></div></div>
<div class="overlay" id="choiceOverlay"><div class="modal" style="max-height:70dvh"><div class="modalheader">♡ 保存先の確認 ♡<span></span><button class="close" id="closeChoice" aria-label="閉じる"><i data-lucide="x"></i></button></div><div class="choice"><div>こちらに保存しますか？</div><div class="choicepath" id="choicePath"></div><div class="choiceactions"><button class="confirm" id="acceptChoice">この保存先に決定 ♡</button><button class="secondary" id="backChoice">戻る</button></div></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><script>
const STORAGE='coordinate-folder-demo-v2';let data;try{data=JSON.parse(localStorage.getItem(STORAGE))}catch{};if(!data||!Array.isArray(data.groups))data={groups:[{id:'g1',name:'グループ1',folders:[{id:'f11',name:'フォルダa1'},{id:'f12',name:'フォルダa2'}]},{id:'g2',name:'グループ2',folders:[1,2,3,4,5].map(i=>({id:'f2'+i,name:'フォルダb'+i}))},{id:'g3',name:'グループ3',folders:[]}],open:['g2'],selected:{gid:'g2',fid:'f22'}};
let edit=null,drag=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=(name,extra='')=>`<i data-lucide="${name}" class="icon ${extra}"></i>`;const icons=()=>window.lucide?.createIcons();const save=()=>localStorage.setItem(STORAGE,JSON.stringify(data));const group=id=>data.groups.find(g=>g.id===id);const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);let toastTimer;function toast(s){clearTimeout(toastTimer);$('toast').textContent=s;$('toast').style.display='block';toastTimer=setTimeout(()=>$('toast').style.display='none',2100)}function render(){renderPicker();renderTree();save();icons()}
function renderPicker(){const sc=$('pickerScroll'),y=sc.scrollTop;$('picker').innerHTML=data.groups.map(g=>{let open=data.open.includes(g.id);return `<div class="group ${open?'open':''}"><button class="gtitle" data-toggle="${g.id}">${icon(open?'chevron-up':'chevron-down')}${icon('folder','treeicon')}<span class="grow">${esc(g.name)}</span></button>${open?`<div class="folders"><button class="direct ${data.selected?.gid===g.id&&!data.selected.fid?'selected':''}" data-pick="${g.id}" data-fid="">${icon(data.selected?.gid===g.id&&!data.selected.fid?'circle-check':'circle')} このグループに直接保存</button>${g.folders.map(f=>`<button class="folder ${data.selected?.fid===f.id?'selected':''}" data-pick="${g.id}" data-fid="${f.id}">${esc(f.name)}${data.selected?.fid===f.id?`<span class="selectedmark">${icon('circle-check')}</span>`:''}</button>`).join('')}<button class="folder addfolder" data-addfolder="${g.id}">${icon('plus')} フォルダを追加</button></div>`:''}</div>`}).join('');sc.scrollTop=y;icons()}
function renderTree(){const sc=$('editorScroll'),y=sc.scrollTop;$('tree').innerHTML=data.groups.map(g=>`<div class="treegroup" data-gid="${g.id}"><div class="treerow" data-kind="group" data-id="${g.id}"><button class="smallbtn" data-toggle="${g.id}" aria-label="開閉">${icon(data.open.includes(g.id)?'chevron-down':'chevron-right')}</button>${icon('folder-open','treeicon')}<span class="name">${esc(g.name)}</span><button class="smallbtn" aria-label="グループを編集" data-edit="group" data-gid="${g.id}">${icon('pencil')}</button><div class="drag" data-drag="group" data-id="${g.id}" aria-label="グループをドラッグ">${icon('menu')}</div></div>${data.open.includes(g.id)?`<div class="treechildren">${g.folders.map(f=>`<div class="treerow folderrow" data-kind="folder" data-id="${f.id}" data-parent="${g.id}">${icon('corner-down-right')} ${icon('folder','treeicon')}<span class="name">${esc(f.name)}</span><button class="smallbtn" aria-label="フォルダを編集" data-edit="folder" data-gid="${g.id}" data-fid="${f.id}">${icon('pencil')}</button><div class="drag" data-drag="folder" data-id="${f.id}" data-parent="${g.id}" aria-label="フォルダをドラッグ">${icon('menu')}</div></div>`).join('')}<button class="treeadd" data-addfolder="${g.id}">${icon('folder-plus')}フォルダを追加</button></div>`:''}</div>`).join('');sc.scrollTop=y;icons()}
function showEditor(){$('editorOverlay').classList.add('show');renderTree();renderEdit();icons()}function hideEditor(){$('editorOverlay').classList.remove('show');edit=null;renderEdit()}function startEdit(kind,gid,fid){let g=group(gid),f=g?.folders.find(x=>x.id===fid);edit={kind,gid,fid};renderEdit(kind==='group'?g?.name:f?.name)}function renderEdit(value){let e=$('editbox');if(!edit){e.innerHTML='';return}let g=group(edit.gid),f=g?.folders.find(x=>x.id===edit.fid),name=value??(edit.kind==='group'?g?.name:f?.name)??'';e.innerHTML=`<div class="editbox"><label for="nameInput">${edit.kind==='group'?'グループ':'フォルダ'}名を変更</label><input id="nameInput" value="${esc(name)}" maxlength="70"><div class="actions"><button id="cancelEdit">キャンセル</button><button class="primary" id="saveName">変更を保存</button></div><button class="danger" id="deleteItem">${icon('trash-2')} この${edit.kind==='group'?'グループ':'フォルダ'}を削除</button></div>`;icons();requestAnimationFrame(()=>$('nameInput')?.focus({preventScroll:true}))}
function addGroup(){let id=uid();data.groups.push({id,name:'新しいグループ',folders:[]});data.open.push(id);render();showEditor();startEdit('group',id)}function addFolder(gid){let g=group(gid);if(!g)return;let id=uid();g.folders.push({id,name:'新しいフォルダ'});if(!data.open.includes(gid))data.open.push(gid);render();showEditor();startEdit('folder',gid,id)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-toggle],[data-pick],[data-addfolder],[data-edit]');if(t?.dataset.toggle){let id=t.dataset.toggle;data.open=data.open.includes(id)?data.open.filter(x=>x!==id):[...data.open,id];render()}else if(t?.dataset.pick){data.selected={gid:t.dataset.pick,fid:t.dataset.fid||null};renderPicker();save()}else if(t?.dataset.addfolder)addFolder(t.dataset.addfolder);else if(t?.dataset.edit)startEdit(t.dataset.edit,t.dataset.gid,t.dataset.fid);if(e.target.closest('#cancelEdit')){edit=null;renderEdit()}if(e.target.closest('#saveName')&&edit){let n=$('nameInput').value.trim();if(!n)return toast('名前を入力してね');let g=group(edit.gid);if(edit.kind==='group')g.name=n;else g.folders.find(f=>f.id===edit.fid).name=n;edit=null;renderEdit();render();toast('名前を変更しました')}if(e.target.closest('#deleteItem')&&edit){let g=group(edit.gid),f=g?.folders.find(x=>x.id===edit.fid),name=edit.kind==='group'?g?.name:f?.name;let msg=edit.kind==='group'?`「${name}」を削除しますか？\nこの試作品ではグループ内のフォルダも削除されます。`:`「${name}」を削除しますか？`;if(!confirm(msg))return;if(edit.kind==='group'){data.groups=data.groups.filter(x=>x.id!==edit.gid);if(data.selected?.gid===edit.gid)data.selected=null}else{g.folders=g.folders.filter(x=>x.id!==edit.fid);if(data.selected?.fid===edit.fid)data.selected={gid:g.id,fid:null}}edit=null;renderEdit();render();toast('削除しました')}});
$('openEditor').onclick=showEditor;$('closeEditor').onclick=hideEditor;$('editorOverlay').addEventListener('click',e=>{if(e.target===$('editorOverlay'))hideEditor()});$('editorAddGroup').onclick=addGroup;$('pickerAddGroup').onclick=addGroup;
function closeChoice(){$('choiceOverlay').classList.remove('show')};$('confirm').onclick=()=>{let g=group(data.selected?.gid),f=g?.folders.find(x=>x.id===data.selected?.fid);if(!g)return toast('保存先を選択してね');$('choicePath').innerHTML=`${icon('folder')}<span>${esc(g.name)}</span>${f?`${icon('chevron-right')}<span>${esc(f.name)}</span>`:'<span>（直接保存）</span>'}`;$('choiceOverlay').classList.add('show');icons()};$('closeChoice').onclick=closeChoice;$('backChoice').onclick=closeChoice;$('choiceOverlay').addEventListener('click',e=>{if(e.target===$('choiceOverlay'))closeChoice()});$('acceptChoice').onclick=()=>{closeChoice();toast('保存先を決定しました（サンプル）')};
// Pointer Events: touch-friendly drag handles. Sorting stays within the same hierarchy.
$('tree').addEventListener('pointerdown',e=>{let handle=e.target.closest('[data-drag]');if(!handle)return;e.preventDefault();let row=handle.closest('.treerow');drag={pointer:e.pointerId,kind:handle.dataset.drag,id:handle.dataset.id,parent:handle.dataset.parent||null,handle,row,target:null,after:false};handle.setPointerCapture(e.pointerId);handle.classList.add('active');row.classList.add('dragging');let ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=row.querySelector('.name').textContent;ghost.style.left=Math.max(12,row.getBoundingClientRect().left)+'px';ghost.style.top=(e.clientY-24)+'px';document.body.appendChild(ghost);drag.ghost=ghost});
$('tree').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;drag.ghost.style.top=(e.clientY-24)+'px';document.querySelectorAll('.dropbefore,.dropafter').forEach(el=>el.classList.remove('dropbefore','dropafter'));let rows=[...$('tree').querySelectorAll(`.treerow[data-kind="${drag.kind}"]`)].filter(r=>r.dataset.id!==drag.id&&(drag.kind==='group'||r.dataset.parent===drag.parent));let target=rows.find(r=>{let b=r.getBoundingClientRect();return e.clientY>=b.top&&e.clientY<=b.bottom});if(target){drag.target=target.dataset.id;drag.after=e.clientY>target.getBoundingClientRect().top+target.offsetHeight/2;target.classList.add(drag.after?'dropafter':'dropbefore')}else drag.target=null;const sc=$('editorScroll'),rect=sc.getBoundingClientRect();if(e.clientY<rect.top+36)sc.scrollTop-=10;else if(e.clientY>rect.bottom-36)sc.scrollTop+=10});
function finishDrag(e){if(!drag||e.pointerId!==drag.pointer)return;let d=drag;drag=null;d.ghost.remove();d.row.classList.remove('dragging');document.querySelectorAll('.dropbefore,.dropafter').forEach(el=>el.classList.remove('dropbefore','dropafter'));if(!d.target)return;let a=d.kind==='group'?data.groups:group(d.parent)?.folders;if(!a)return;let from=a.findIndex(x=>x.id===d.id),to=a.findIndex(x=>x.id===d.target);if(from<0||to<0)return;let [item]=a.splice(from,1);to=a.findIndex(x=>x.id===d.target)+(d.after?1:0);a.splice(to,0,item);render()};$('tree').addEventListener('pointerup',finishDrag);$('tree').addEventListener('pointercancel',e=>{if(drag){drag.ghost.remove();drag=null;renderTree()}});render();icons();
</script></body></html>
