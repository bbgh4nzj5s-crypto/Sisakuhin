let piInlineEdit=null,piDeleteConfirm=null,piInlineDraft='';
function piEditBegin(kind,cid,tag=''){piInlineEdit={kind,cid,tag};piInlineDraft=kind==='cat'?(piTags.find(c=>c.id===cid)?.name||''):kind==='tag'?tag:''}
function piEditSave(){
 if(!piInlineEdit)return;
 const {kind,cid,tag}=piInlineEdit,v=piInlineDraft.trim(),c=piTags.find(x=>x.id===cid);
 if(!v)return;
 if((kind==='cat'||kind==='newcat')&&piTags.some(x=>x.name===v&&x.id!==cid))return;
 if((kind==='tag'||kind==='newtag')&&c?.tags.some(x=>x===v&&x!==tag))return;
 if(kind==='cat'&&c)c.name=v;
 if(kind==='tag'&&c){c.tags=c.tags.map(t=>t===tag?v:t);piRenameTagReferences(tag,v)}
 if(kind==='newcat')piTags.push({id:'user_'+Date.now(),name:v,fixed:false,tags:[]});
 if(kind==='newtag'&&c)c.tags.push(v);
 piInlineEdit=null;piSaveTags();
}
function piRenameTagReferences(oldName,newName){
 Object.values(piItemMeta).forEach(m=>m.tags=(m.tags||[]).map(t=>t===oldName?newName:t));
 Object.keys(piCoordTags).forEach(k=>piCoordTags[k]=(piCoordTags[k]||[]).map(t=>t===oldName?newName:t));
 piTagSelected=piTagSelected.map(t=>t===oldName?newName:t);
 piCoordTagSelected=piCoordTagSelected.map(t=>t===oldName?newName:t);
 piSaveMeta();piSaveCoordTags();
}
function piDeleteTagReferences(name){
 Object.values(piItemMeta).forEach(m=>m.tags=(m.tags||[]).filter(t=>t!==name));
 Object.keys(piCoordTags).forEach(k=>piCoordTags[k]=(piCoordTags[k]||[]).filter(t=>t!==name));
 piTagSelected=piTagSelected.filter(t=>t!==name);
 piCoordTagSelected=piCoordTagSelected.filter(t=>t!==name);
 piSaveMeta();piSaveCoordTags();
}

piDeletetag);if(c&&confirm('タグを削除しますか？')){c.tags=c.tags.filter(t=>t!==d.value);Object.values(piItemMeta).forEach(m=>m.tags=(m.tags||[]).filter(t=>t!==d.value));piTagSelected=piTagSelected.filter(t=>t!==d.value);piSaveMeta();piSaveTags()}}listRecords()}
function listRecords(){if(piView==='item'){piItemRender();return}content.classList.remove('pi-items-mode');const all=parse(S,[]);for(const r of all)if(!ui.order.includes(r.id))ui.order.push(r.id);uiSave();const rs=filteredRecords().filter(r=>piCoordTagSelected.every(t=>(piCoordTags[r.id]||[]).includes(t)));content.classList.add('pi-page');content.innerHTML='<h1 class="pi-title">♡ コーデアイテム ♡</h1><div class="pi-cats"><button class="on" data-pi-view="coordinate">コーデ</button><button data-pi-view="item">アイテム</button></div><div class="pi-panel"><button class="pi-accordion" data-pi="folderOpen">▱ <b>コーデリスト</b><small>'+(allGroups?'すべてのグループ':Object.keys(filterGroups).length+'グループ選択中')+'</small><span>'+(folderOpen?'⌃':'⌄')+'</span></button>'+(folderOpen?'<div class="pi-folder-scroll"><button class="pi-all '+(allGroups?'selected':'')+'" data-pi="all">✓ すべてのグループ・フォルダ</button>'+'<button class="pi-all" data-pi="uncategorized">未分類</button>'+groups.map(g=>'<section class="pi-group"><div class="pi-grouphead"><button data-pi="group" data-g="'+esc(g.id)+'">'+(!allGroups&&filterGroups[g.id]?.all?'☑':'□')+' '+esc(g.name)+'</button><button data-pi="expand" data-g="'+esc(g.id)+'">'+(groupOpen[g.id]?'⌃':'⌄')+'</button></div>'+(groupOpen[g.id]?'<div class="pi-folders"><button class="pi-folder '+(!allGroups&&filterGroups[g.id]?.all?'selected':'')+'" data-pi="group" data-g="'+esc(g.id)+'">✓ 全部</button>'+[...(g.folders||[]),{id:'direct',name:'直接保存'}].map(f=>'<button class="pi-folder '+(!allGroups&&(filterGroups[g.id]?.all||filterGroups[g.id]?.folders.includes(f.id))?'selected':'')+'" data-pi="folder" data-g="'+esc(g.id)+'" data-f="'+esc(f.id)+'">'+esc(f.name)+'</button>').join('')+'</div>':'')+'</section>').join('')+'</div><button class="pi-done" data-pi="folderClose">この条件で表示 ♡</button>':'')+'</div><div class="pi-toolbar"><input data-pi-search placeholder="コーデ名で検索" value="'+esc(queryText)+'"><button data-pi="sortOpen">☰ 並び順</button></div>'+(sortOpen?'<div class="pi-panel pi-sort">'+[['registere function piAction(b){const a=b.dataset.pi,g=b.dataset.g;if(a==='coordFilterReset'){piCoordTagSelected=[];ownedFilter='all';markFilter='all'}else if(a==='coordFilter')piCoordFilterOpen=!piCoordFilterOpen;else if(a==='coordFilterTag'){const t=b.dataset.value;piCoordTagSelected=piCoordTagSelected.includes(t)?piCoordTagSelected.filter(x=>x!==t):[...piCoordTagSelected,t]}else if(a==='coordFilterClear')piCoordTagSelected=[];else if(a==='coordFilterClose')piCoordFilterOpen=false;else if(a==='folderOpen')folderOpen=!folderOpen;else if(a==='folderClose')folderOpen=false;else if(a==='all'){allGroups=true;filterUncategorized=false;filterGroups={}}else if(a==='uncategorized'){allGroups=false;filterUncategorized=true;filterGroups={}}else if(a==='expand')groupOpen[g]=!groupOpen[g];else if(a==='group'){filterUncategorized=false;allGroups=false;if(filterGroups[g]?.all)delete filterGroups[g];else filterGroups[g]={all:true,folders:[]}}else if(a==='folder'){filterUncategorized=false;allGroups=false;let s=filterGroups[g]||{all:false,folders:[]};if(s.all)s={all:false,folders:[...(groups.find(x=>x.id===g)?.folders||[]).map(x=>x.id),'direct']};s.folders=s.folders.includes(b.dataset.f)?s.folders.filter(x=>x!==b.dataset.f):[...s.folders,b.dataset.f];if(s.folders.length)filterGroups[g]=s;else delete filterGroups[g]}else if(a==='sortOpen')sortOpen=!sortOpen;else if(a==='sort'){sortMode=b.dataset.value;sortOpen=false;editingOrder=false}else if(a==='owned')ownedFilter=b.dataset.value;else if(a==='marks')markFilter=b.dataset.value;else if(a==='edit')editingOrder=!editingOrder;else if(a==='mark'){const id=b.dataset.id,m=ui.marks[id]||{};ui.marks[id]={...m,[b.dataset.which]:!m[b.dataset.which]};uiSave()}listRecords()}

 if(idx>0)track.append(makeNeighbor(cats[idx-1]));track.append(body);if(idx<cats.length-1)track.append(makeNeighbor(cats[idx+1]));

function variantGroupMembers(records, targetId){

  if((linked.some(id=>ids.has(id)))&&linked.some(id=>!ids.has(id))){
   linked.forEach(id=>ids.add(id));changed=true;
  }

 if(groupIds.size){let again=true;while(again){again=false;for(const r of records){
  if(r.variantGroupId&&groupIds.has(r.variantGroupId)&&!ids.has(r.id)){

  }

}
function variantGroupId(records,targetId){

/* Pricoletta unified registration + item editor styling — visual-only v2.9 */
:root{
 --pc-surface:#fffefd;
 --pc-surface-soft:#fff7fc;
 --pc-outline-strong:#f3c1df;
 --pc-heading:#d65c9e;
 --pc-muted:#9d8195;
 --pc-focus:#a66bd0;
 --pc-radius-panel:20px;
 --pc-radius-slot:16px;
}
/* The fixed registration layout and its independently scrolling strips are preserved. */
.registration-fixed .new-reg .reg-body{
 background:var(--pc-surface)!important;
 border-color:var(--pc-outline-strong)!important;
 border-radius:var(--pc-radius-panel)!important;
 box-shadow:0 3px 0 #f8d8ea!important;
}
.registration-fixed .new-reg .reg-page-title,
.registration-fixed .new-reg .reg-colors-heading{color:var(--pc-heading)!important}
.registration-fixed .new-reg .image-grid .slot{
 border-color:#e8afd2!important;
 border-radius:var(--pc-radius-slot)!important;
 background:var(--pc-surface-soft)!important;
}
.registration-fixed .new-reg .reg-tray-add{
 border-color:#e8afd2!important;
 border-radius:var(--pc-radius-slot)!important;
 background:var(--pc-surface-soft)!important;
}
.registration-fixed .new-reg .reg-footer .game-button,
.ie-save{
 border:3px solid white!important;
 border-radius:var(--pc-radius-button)!important;
 background:var(--pc-pink)!important;
 color:white!important;
 box-shadow:0 5px var(--pc-pink-shadow),inset 0 0 0 2px var(--pc-pink-inset)!important;
 text-shadow:0 1px #be4785;
 font-weight:900!important;
}
.registration-fixed .new-reg .reg-footer .game-button:active,
.ie-save:not(:disabled):active{
 transform:translateY(3px);
 box-shadow:0 2px var(--pc-pink-shadow),inset 0 0 0 2px var(--pc-pink-inset)!important;
}
/* The editor stays a centered overlay; its header/footer are fixed and body scrolls. */
.ie-backdrop{background:rgba(75,39,65,.57)}
.ie-modal{
 border-color:var(--pc-outline-strong);
 border-radius:var(--pc-radius-panel);
 background:var(--pc-surface);
 color:var(--pc-ink);
 box-shadow:0 12px 36px rgba(91,43,75,.25);
}
.ie-header,.ie-footer{background:var(--pc-surface);border-color:var(--pc-outline-strong)}
.ie-header strong{color:var(--pc-heading)}
.ie-close{
 border-color:var(--pc-secondary-outline);
 border-radius:12px;
 background:var(--pc-soft);
 color:var(--pc-secondary-ink);
}
.ie-scroll{background:var(--pc-surface)}
.ie-media button{
 border-color:#e8afd2;
 border-radius:var(--pc-radius-slot);
 background:var(--pc-surface-soft);
 color:var(--pc-heading);
}
.ie-section h3{color:var(--pc-heading)}
.ie-tag-group h4{color:var(--pc-ink)}
.ie-chip,.ie-add{
 border-color:var(--pc-secondary-outline);
 background:var(--pc-soft);
 color:var(--pc-secondary-ink);
}
.ie-chip.on{
 background:var(--pc-pink);
 border-color:var(--pc-pink-shadow);
 color:white;
}
.ie-add{border-style:dashed;background:var(--pc-surface)}
.ie-memo{border-color:var(--pc-secondary-outline);color:var(--pc-ink);background:white}
.ie-mark{border-color:var(--pc-secondary-outline);color:var(--pc-secondary-ink)}
.ie-mark.on{background:var(--pc-pink);border-color:var(--pc-pink-shadow);color:white}
.ie-save{outline:none!important;min-height:49px}
.ie-save:disabled{opacity:.55}
.ie-close:focus-visible,.ie-media button:focus-visible,.ie-chip:focus-visible,
.ie-add:focus-visible,.ie-memo:focus-visible,.ie-save:focus-visible,
.registration-fixed .new-reg button:focus-visible{
 outline:3px solid var(--pc-focus)!important;
 outline-offset:2px;
}

/* v2.9.3: only the back control is fixed; original primary actions stay in their cards. */
.page-scroll.pc-flow-screen .reg-footer{display:grid!important}
.page-scroll.pc-flow-screen .reg-footer .reg-back{display:none!important}
.page-scroll.pc-flow-screen .dest-bottom .dest-confirm{display:block!important}
.page-scroll.pc-flow-screen>.card{min-height:0;overflow-y:auto}
.pc-flow-footer.pc-back-only{display:flex!important;justify-content:flex-start!important;align-items:center!important;flex:0 0 auto!important;padding:5px 12px calc(5px + env(safe-area-inset-bottom))!important;margin-top:auto!important;min-height:48px!important}
.pc-flow-footer.pc-back-only .pc-flow-back{width:auto!important;text-align:left!important;padding:8px 4px!important}


/* Registration step 2: compact candidate list and color-variation choice */
.pc-match-list{display:flex;flex-direction:column;gap:10px;max-height:min(42vh,340px);overflow-y:auto;overscroll-behavior:contain;padding:3px 2px 6px}
.pc-match-card{background:#fff;border:2px solid #f0c6df;border-radius:17px;padding:11px;display:flex;flex-direction:column;gap:9px}
.pc-match-head{display:flex;align-items:center;gap:9px;min-width:0}

.pc-match-add{width:100%;margin:0!important;padding:10px 12px!important;font-size:13px!important}
.pc-match-actions{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pc-new-button{border:2px solid #dca5c8;border-radius:14px;background:white;color:#b45792;font-weight:700;padding:12px}
.pc-new-panel{background:#fff;border:2px solid #f0c6df;border-radius:17px;padding:15px;display:flex;flex-direction:column;gap:12px}

.pc-variant-option input{accent-color:#e60060}.pc-variant-list{max-height:200px;overflow-y:auto;border:1px solid #f0c6df;border-radius:12px;padding:5px}
 .pc-group-count{display:block;color:#a18a99;font-size:11px;margin-top:3px}

d,variantParentId:r.variantParentId||null,detailMode:!!draft.detailMode,step:draft.detailMode?6:3};render()}return}if(b.dataset.open){const r=parse(S,[]).find(x=>x.id===b.dataset.open);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destinationRef||r.destination,existingId:r.id,step:3};render()}return}if(b.dataset.removeTray){if(selectedTray===b.dataset.removeTray)selectedTray=null;draft.unplaced=draft.unplaced.filter(x=>x!==b.dataset.removeTray);saveDraft();render();return}if(b.dataset.return){await returnSlot(b.dataset.return);return}if(b.dataset.tray){chooseTray(b.dataset.tray);return}if(b.dataset.slot){if(selectedTray&&draft.unplaced.includes(selectedTray)&&['image','qr'].includes(b.dataset.slot)){const chosen=selectedTray;selectedTray=null;try{await assign(chosen,b.dataset.slot);render()}catch(e){alert('画像を配置できませんでした')}return}upload(b.dataset.slot);return}const a=b.dataset.act;if(!a)return;if(a==='detail-save'){draft.step=4;render();return}if(a==='detail-tags'){showDetailTags();return}if(a==='detail-tags-close'){document.querySelector('.pc-detail-tags')?.remove();return}if(a==='detail-second'){upload('detailSecond');return}if(a==='detail-swap'){const old=draft.full;draft.full=draft.fullSecond;draft.fullSecond=old;render();return}if(a==='qr-settings'){const opened=document.querySelector('.pc-qr-portal');if(opened){opened.remove();b.setAttribute('aria-expanded','false');return}const p=$('#qr-settings-panel');if(p){p.hidden=false;document.body.append(p);p.classList.add('pc-qr-portal');b.setAttribute('aria-expanded','true')}return}if(a==='qr-settings-close'){document.querySelector('.pc-qr-portal')?.remove();content.querySelector('[data-act=qr-settings]')?.setAttribute('aria-expanded','false');return}if(a==='exit'){pages('register');return}if(a==='back'){draft.step=draft.detailMode&&draft.step===6?1:draft.detailMode&&draft.step===4?6:(draft.step===3?1:Math.max(0,draft.step-1));render();return}if(a==='name'){draft.type=content.querySelector('input[name=type]:checked')?.value||draft.type;draft.name=$('#name')?.value.trim()||'';if(!draft.name){alert('コーデ名を入力してね');return}draft.step=1}else if(a==='new'){draft.newMode=false;draft.variantMode=false;draft.variantParentId=null;draft.existingId=null;draft.items={};draft.step=draft.detailMode?6:3;draft.cat=CATS[draft.type][0];render();return}else if(a==='candidate-list'){draft.newMode=false;render();return}else if(a==='new-next'){if(draft.variantMode&&!draft.variantParentId){alert('色違いのコーデを選んでね');return}draft.existingId=null;draft.items={};draft.step=draft.detailMode?6:3;draft.cat=CATS[draft.type][0]}else if(a==='items'){draft.step=3;draft.cat=CATS[draft.type][0];for(const c of CATS[draft.type]){const i=item(c);if(!i.manualColors&&!i.image&&!i.colors.length){i.rank=COLORS.map(x=>x[0]);const names=COLORS.filter(x=>draft.name.includes(x[0])).map(x=>x[0]);if(names.length){i.rank=[...names,...i.rank.filter(x=>!names.includes(x))];i.colors=names.slice(0,2)}}}}else if(a==='destination'){draft.step=4;destinationEditing=false;}else if(a==='confirm')draft.step=5;else if(a==='save'){save();return}else if(a==='add'){upload('tray');return}render()});

// Touch drag and pointer drag use a single fixed preview; tapping still selects an image.
let trayGesture=null;
// v2.9.8-based editor: edge-hover category switching only while dragging an unplaced image.
// The normal card swipe handler is untouched. The preview remains attached to <body>
// while the item editor is re-rendered for the newly selected category.
// Drag-edge navigation: animate the existing carousel track instead of
// replacing the card immediately. Moving back inward cancels pending/active motion.
function clearTrayEdgeTimer(g){
 if(!g)return;
 if(g.edgeTimer){clearTimeout(g.edgeTimer);g.edgeTimer=null}
}
function trayEdgeDirection(x,y){
 const car=content.querySelector('.registration-fixed .pc-carousel');
 if(!car||draft.step!==3)return 0;
 const r=car.getBoundingClientRect();
 if(y<r.top-35||y>r.bottom+35)return 0;
 return x<=r.left+36?-1:x>=r.right-36?1:0;
}
function stopTrayEdgeAnimation(g){
 if(!g?.edgeAnimation)return;
 const a=g.edgeAnimation;
 g.edgeAnimation=null;
 a.track.removeEventListener('transitionend',a.done);
 clearTimeout(a.fallback);
 // Do not reverse a category already committed by the animation.
 pcSetPosition(a.track,a.base,false);
}
// Refresh only the carousel. Never replace the touched tray thumbnail during a drag.
function trayRefreshCategory(){
 const car=content.querySelector('.registration-fixed .pc-carousel');
 const body=car?.querySelector('.pc-track > .reg-body:not(.pc-neighbor)');
 if(!body)return;
 const cat=draft.cat;
 const heading=body.querySelector('.item-heading strong');
 if(heading)heading.innerHTML='<span class="cat-icon">'+categoryIcon(cat)+'</span>'+esc(cat);
 const state=body.querySelector('.status');
 if(state){state.textContent=statusSymbol(cat)+' '+status(cat);state.className='status '+statusClass(cat)}
 body.querySelectorAll('[data-preview]').forEach(el=>{
   const kind=el.dataset.preview;
   const it=item(cat),id=kind==='image'?it.image:(it.qrDigital||it.qrPhoto);
   el.innerHTML=kind==='image'?categoryIcon(cat)+'<small>アイテム画像</small>':'<small>QR画像</small>';
   if(id)url(id).then(src=>{if(el.isConnected&&draft.cat===cat){const img=document.createElement('img');img.src=src;el.replaceChildren(img)}}).catch(()=>{});
 });
 body.querySelectorAll('.slot .remove').forEach(el=>el.remove());
 body.querySelectorAll('[data-slot]').forEach(el=>el.classList.remove('drop-target'));
 const tabs=content.querySelectorAll('.registration-fixed .category-name');
 tabs.forEach(el=>el.classList.toggle('active',el.dataset.cat===cat));
 pcBuildTrack();
}
function armTrayEdge(g,direction){
 if(!g||trayGesture!==g)return;
 if(g.edgeAnimation)return;
 if(g.edgeDirection===direction&&g.edgeTimer)return;
 clearTrayEdgeTimer(g);
 g.edgeDirection=direction;
 if(!direction)return;
 const cats=CATS[draft.type],idx=cats.indexOf(draft.cat);
 if(idx+direction<0||idx+direction>=cats.length)return;
 g.edgeTimer=setTimeout(()=>{
   g.edgeTimer=null;
   if(trayGesture!==g||!g.active||g.edgeDirection!==direction)return;
   if(trayEdgeDirection(g.lastX,g.lastY)!==direction){g.edgeDirection=0;return}
   const car=content.querySelector('.registration-fixed .pc-carousel');
   const track=car?.querySelector('.pc-track');
   if(!track)return;
   const base=Number(car.dataset.base),step=Number(car.dataset.step);
   const current=CATS[draft.type].indexOf(draft.cat),next=current+direction;
   if(next<0||next>=CATS[draft.type].length)return;
   const animation={direction,track,base,done:null,fallback:null};
   g.edgeAnimation=animation;
   track.style.transition='transform 380ms cubic-bezier(.22,.75,.25,1)';
   track.style.transform='translate3d('+(base-direction*step)+'px,0,0)';
   const done=e=>{
     if(e&&e.target!==track)return;
     if(trayGesture!==g||g.edgeAnimation!==animation)return;
     track.removeEventListener('transitionend',done);
     clearTimeout(animation.fallback);
     g.edgeAnimation=null;
     draft.cat=CATS[draft.type][next];
     saveDraft();
     // pcBuildTrack changes only the carousel, leaving the active touch source intact.
     trayRefreshCategory();
     g.edgeDirection=0;
     if(trayGesture===g&&g.active)armTrayEdge(g,trayEdgeDirection(g.lastX,g.lastY));
   };
   animation.done=done;
   track.addEventListener('transitionend',done);
   animation.fallback=setTimeout(()=>done(),480);
 },550);
}
function dragMove(x,y){
 const g=trayGesture;if(!g)return;

 if(!g.active&&Math.abs(x-g.x)>Math.abs(y-g.y)*1.15&&Math.abs(x-g.x)>7){g.scrolling=true;return}
 if(g.scrolling)return;
 if(Math.hypot(x-g.x,y-g.y)>12&&!g.active){
  g.active=true;const img=g.element.querySelector('img');if(!img){g.active=false;return}
  g.ghost=img.cloneNode();g.ghost.className='tray-drag-ghost';
  g.ghost.style.width=g.element.offsetWidth+'px';g.ghost.style.height=g.element.offsetHeight+'px';
  document.body.append(g.ghost);g.element.classList.add('dragging');
 }
 if(g.active){
  g.ghost.style.left=(x-g.element.offsetWidth/2)+'px';
  g.ghost.style.top=(y-g.element.offsetHeight/2)+'px';
  const edge=trayEdgeDirection(x,y);
  armTrayEdge(g,edge);
  const slot=document.elementFromPoint(x,y)?.closest('.registration-fixed [data-slot]');
  document.querySelectorAll('.registration-fixed [data-slot="image"],.registration-fixed [data-slot="qr"]').forEach(el=>el.classList.toggle('drop-target',el===slot));
 }
}
async function dragEnd(x,y){
 const g=trayGesture;trayGesture=null;if(!g)return;
 clearTrayEdgeTimer(g);stopTrayEdgeAnimation(g);g.ghost?.remove();g.element.classList.remove('dragging');
 document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
 if(!g.active)return;
 suppressTap=true;
 const slot=document.elementFromPoint(x,y)?.closest('.registration-fixed [data-slot]');
 if(slot&&['image','qr'].includes(slot.dataset.slot)&&draft.unplaced.includes(g.id)){
  selectedTray=null;try{await assign(g.id,slot.dataset.slot);render()}catch(e){alert('画像を配置できませんでした')}
 }
 if(draft.step===3)render();
 setTimeout(()=>{suppressTap=false},200);
}
content.addEventListener('touchstart',e=>{const el=e.target.closest('[data-tray]');if(!el||e.target.closest('[data-remove-tray]'))return;const t=e.touches[0];trayGesture={id:el.dataset.tray,element:el,x:t.clientX,y:t.clientY,active:false}},{passive:true});
content.addEventListener('touchmove',e=>{if(!trayGesture)return;const t=e.touches[0];dragMove(t.clientX,t.clientY);if(trayGesture?.active)e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{if(trayGesture){const t=e.changedTouches[0];void dragEnd(t.clientX,t.clientY)}},{passive:true});
function cancelTrayDrag(){const g=trayGesture;if(!g)return;trayGesture=null;clearTrayEdgeTimer(g);stopTrayEdgeAnimation(g);g.ghost?.remove();g.element?.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));if(g.active&&draft.step===3)render()}

 document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelTrayDrag()});
 window.addEventListener('pagehide',cancelTrayDrag);
content.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-tray]');if(!el||e.target.closest('[data-remove-tray]'))return;trayGesture={id:el.dataset.tray,element:el,x:e.clientX,y:e.clientY,active:false} });
content.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&trayGesture)dragMove(e.clientX,e.clientY)});
document.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'&&trayGesture)void dragEnd(e.clientX,e.clientY)});
 document.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')cancelTrayDrag()});

content.addEventListener('input',e=>{if(e.target.matches('[data-pi-itemsearch]')){piItemSearch=e.target.value;piItemRender();const input=content.querySelector('[data-pi-itemsearch]');input?.focus();try{input?.setSelectionRange(piItemSearch.length,piItemSearch.length)}catch{};return}if(e.target.matches('[data-pi-search]')){const p=e.target.selectionStart;queryText=e.target.value;listRecords();const input=content.querySelector('[data-pi-search]');input?.focus();try{input?.setSelectionRange(p,p)}catch{}}});content.addEventListener('pointerdown',piPointerDown);content.addEventListener('pointermove',piPointerMove);content.addEventListener('pointerup',piPointerEnd);content.addEventListener('pointercancel',piPointerEnd);
window.addEventListener('pagehide',saveDraft);
})();
