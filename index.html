<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), content=$('#page-content'), heading=$('#page-heading');
const K='pricoletta_draft_v2',S='pricoletta_records_v2',D='pricoletta_assets_v2',STORE='assets',GROUPS_KEY='pricoletta_destination_groups_v1';
const CATS={separate:['アクセ','トップス','ボトムス','シューズ'],dress:['アクセ','ワンピース','シューズ']};
const COLORS=[['ピンク','#f58bbf'],['赤','#e76068'],['オレンジ','#f4a153'],['黄色','#efd35b'],['緑','#73b67c'],['水色','#8bd3eb'],['青','#6d91df'],['紫','#ab91d3'],['白','#ffffff'],['黒','#37343b'],['茶色','#a27b60'],['グレー','#a6a4a9']];
const fresh=()=>({name:'',type:'separate',step:0,cat:'アクセ',items:{},unplaced:[],thumbnail:null,full:null,destination:'グループ1',existingId:null});
let draft=fresh(),db=null,urls=[],drag=null,busy=false,suppressTap=false,hydrateSerial=0;

const defaultGroups=()=>[{id:'g1',name:'グループ1',open:false,folders:[{id:'a1',name:'フォルダa1'},{id:'a2',name:'フォルダa2'},{id:'a3',name:'フォルダa3'}]},{id:'g2',name:'グループ2',open:true,folders:[{id:'b1',name:'フォルダb1'},{id:'b2',name:'フォルダb2'},{id:'b3',name:'フォルダb3'},{id:'b4',name:'フォルダb4'},{id:'b5',name:'フォルダb5'}]},{id:'g3',name:'グループ3',open:false,folders:[]}];
let groups=defaultGroups(),destinationEditing=false,destinationDialog=null,destinationGesture=null;
try{const loaded=JSON.parse(localStorage.getItem(GROUPS_KEY));if(Array.isArray(loaded)&&loaded.length)groups=loaded}catch{}
function persistGroups(){try{localStorage.setItem(GROUPS_KEY,JSON.stringify(groups))}catch(e){console.warn('group save failed',e)}}
const folderIcon=(blue=false)=>'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="'+(blue?'#3bb0d0':'#d55a9f')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>';
const handleIcon='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>';
function selectedDestination(){const d=draft.destination;if(d&&typeof d==='object')return d;const g=groups.find(x=>x.name===d)||groups[0];return {groupId:g?.id||'',folderId:null}}
function destinationLabel(){const d=selectedDestination(),g=groups.find(x=>x.id===d.groupId),f=g?.folders.find(x=>x.id===d.folderId);return g?g.name+' › '+(f?f.name:'直接保存'):'未選択'}
function destinationMarkup(){const sel=selectedDestination();return '<div class="destination-screen"><div class="dest-head"><h2>保存先をえらぶ</h2><button type="button" data-dest="edit" class="dest-edit">'+(destinationEditing?'✓ 完了':'⋯ 編集')+'</button></div><p class="dest-help">'+(destinationEditing?'鉛筆で名前変更。二本線を指でつかんで並び替えてね。':'グループに直接保存することも、フォルダに保存することもできます。')+'</p><div class="dest-list-label">コーデリスト</div><div class="dest-scroll">'+groups.map((g,gi)=>'<section class="dest-group" data-group-id="'+esc(g.id)+'"><div class="dest-group-header"><button type="button" data-dest="toggle" data-gid="'+esc(g.id)+'" class="dest-group-toggle"><span class="dest-chevron">'+(g.open?'⌄':'›')+'</span>'+folderIcon()+'<span class="dest-group-name">'+esc(g.name)+'</span></button>'+(destinationEditing?'<button type="button" class="dest-pencil" data-dest="rename-group" data-gid="'+esc(g.id)+'" aria-label="グループ名変更">✎</button><span class="dest-handle" data-sort="group" data-id="'+esc(g.id)+'" aria-label="グループをドラッグで並び替え">'+handleIcon+'</span>':'<span class="dest-chevron">'+(g.open?'⌃':'⌄')+'</span>')+'</div>'+(g.open?(destinationEditing?'<div class="dest-folder-edit">'+g.folders.map(f=>'<div class="dest-folder-line" data-folder-id="'+esc(f.id)+'" data-parent-id="'+esc(g.id)+'"><span class="dest-indent">↳</span>'+folderIcon(true)+'<span class="dest-folder-long">'+esc(f.name)+'</span><button type="button" class="dest-pencil" data-dest="rename-folder" data-gid="'+esc(g.id)+'" data-fid="'+esc(f.id)+'" aria-label="フォルダ名変更">✎</button><span class="dest-handle" data-sort="folder" data-id="'+esc(f.id)+'" data-parent="'+esc(g.id)+'" aria-label="フォルダをドラッグで並び替え">'+handleIcon+'</span></div>').join('')+'<button type="button" class="dest-add-folder-line" data-dest="add-folder" data-gid="'+esc(g.id)+'">⊞ フォルダを追加</button></div>':'<div class="dest-folder-select"><button type="button" class="dest-direct '+(sel.groupId===g.id&&!sel.folderId?'chosen':'')+'" data-dest="select" data-gid="'+esc(g.id)+'" data-fid="">'+(sel.groupId===g.id&&!sel.folderId?'◉':'◯')+' フォルダを使わず直接保存</button><div class="dest-folder-grid">'+g.folders.map(f=>'<button type="button" class="dest-folder-tile '+(sel.groupId===g.id&&sel.folderId===f.id?'chosen':'')+'" data-dest="select" data-gid="'+esc(g.id)+'" data-fid="'+esc(f.id)+'"><span>'+esc(f.name)+'</span>'+(sel.groupId===g.id&&sel.folderId===f.id?'<b>✓</b>':'')+'</button>').join('')+'<button type="button" class="dest-folder-tile dest-add-tile" data-dest="add-folder" data-gid="'+esc(g.id)+'">＋ フォルダを追加</button></div></div>'):'')+'</section>').join('')+'<button type="button" class="dest-add-group" data-dest="add-group">⊞ 新しいグループを追加</button></div><div class="dest-bottom"><div class="dest-selected"><small>選択した保存先</small><strong>▱ '+esc(destinationLabel())+'</strong></div><button type="button" class="dest-confirm" data-act="confirm" '+(destinationEditing?'disabled':'')+'>この保存先に決定 ♡</button></div><div id="dest-dialog" class="dest-dialog" hidden></div></div>'}
function showDestinationDialog(mode,gid,fid){destinationDialog={mode,gid,fid};const g=groups.find(x=>x.id===gid),f=g?.folders.find(x=>x.id===fid),old=mode==='rename-group'?g?.name:mode==='rename-folder'?f?.name:'';const box=document.getElementById('dest-dialog');if(!box)return;box.hidden=false;box.innerHTML='<div class="dest-dialog-box"><div class="dest-dialog-top"><strong>♡ '+(mode.startsWith('rename')?'名前を変更':mode==='add-group'?'グループを追加':'フォルダを追加')+' ♡</strong><button type="button" data-dest="close-dialog">×</button></div><input id="dest-name" maxlength="120" value="'+esc(old||'')+'" placeholder="名前を入力"><div class="dest-dialog-actions"><button type="button" data-dest="close-dialog">キャンセル</button><button type="button" data-dest="apply-dialog">'+(mode.startsWith('rename')?'変更':'追加')+'</button></div>'+(mode.startsWith('rename')?'<button type="button" class="dest-delete" data-dest="delete-dialog">削除する</button>':'')+'</div>';box.querySelector('input')?.focus()}
function destinationAction(btn){const act=btn.dataset.dest,gid=btn.dataset.gid,fid=btn.dataset.fid,g=groups.find(x=>x.id===gid);if(act==='edit'){destinationEditing=!destinationEditing;render();return true}if(act==='toggle'&&g){g.open=!g.open;persistGroups();render();return true}if(act==='select'&&g){draft.destination={groupId:gid,folderId:fid||null};saveDraft();render();return true}if(['add-group','add-folder','rename-group','rename-folder'].includes(act)){showDestinationDialog(act,gid,fid);return true}if(act==='close-dialog'){destinationDialog=null;document.getElementById('dest-dialog').hidden=true;return true}if(act==='apply-dialog'&&destinationDialog){const val=document.getElementById('dest-name')?.value.trim();if(!val)return true;const d=destinationDialog,gg=groups.find(x=>x.id===d.gid);if(d.mode==='add-group')groups.push({id:crypto.randomUUID(),name:val,open:true,folders:[]});if(d.mode==='add-folder'&&gg){gg.folders.push({id:crypto.randomUUID(),name:val});gg.open=true}if(d.mode==='rename-group'&&gg)gg.name=val;if(d.mode==='rename-folder'&&gg){const ff=gg.folders.find(x=>x.id===d.fid);if(ff)ff.name=val}destinationDialog=null;persistGroups();render();return true}if(act==='delete-dialog'&&destinationDialog){if(!confirm('本当に削除する？ 保存済みのコーデは削除されません。'))return true;const d=destinationDialog;if(d.mode==='rename-group')groups=groups.filter(x=>x.id!==d.gid);if(d.mode==='rename-folder'){const gg=groups.find(x=>x.id===d.gid);if(gg)gg.folders=gg.folders.filter(x=>x.id!==d.fid)}const sel=selectedDestination();if(!groups.some(x=>x.id===sel.groupId))draft.destination={groupId:groups[0]?.id||'',folderId:null};else if(sel.folderId&&!groups.find(x=>x.id===sel.groupId)?.folders.some(x=>x.id===sel.folderId))draft.destination={groupId:sel.groupId,folderId:null};destinationDialog=null;persistGroups();saveDraft();render();return true}return false}
function finishDestinationDrag(e,cancelled=false){const d=destinationGesture;if(!d)return;destinationGesture=null;d.source?.classList.remove('dest-dragging');document.querySelectorAll('.dest-drop-target').forEach(x=>x.classList.remove('dest-drop-target'));if(!cancelled&&d.target&&d.moved){if(d.kind==='group'){const i=groups.findIndex(g=>g.id===d.id),j=groups.findIndex(g=>g.id===d.target.dataset.groupId);if(i>=0&&j>=0&&i!==j){const [g]=groups.splice(i,1);groups.splice(j,0,g)}}else{const g=groups.find(x=>x.id===d.parent),i=g?.folders.findIndex(f=>f.id===d.id),j=g?.folders.findIndex(f=>f.id===d.target.dataset.folderId);if(g&&i>=0&&j>=0&&i!==j){const [f]=g.folders.splice(i,1);g.folders.splice(j,0,f)}}persistGroups();render()}else if(d.moved){render()} }

const parse=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};

'アクセ':'<path d="M3 8 7.5 12 12 5l4.5 7L21 8l-2 11H5L3 8Z"/><path d="M5 21h14"/>',
'トップス':'<path d="m8 4-5 4-1 6 5 2 1-3v9h8v-9l1 3 5-2-1-6-5-4-2 3Z"/>',
'ボトムス':'<path d="M6 3h12l2 19h-7l-1-10-1 10H4L6 3Z"/><path d="M6 8h12"/>',

 node.querySelectorAll('[data-preview]').forEach(el=>{const kind=el.dataset.preview;el.innerHTML=kind==='image'?categoryIcon(cat)+'<small>アイテム画像</small>':'<small>QR画像</small>';const it=item(cat),id=kind==='image'?it.image:(it.qrDigital||it.qrPhoto);if(id){url(id).then(src=>{if(node.isConnected){const img=document.createElement('img');img.src=src;el.replaceChildren(img)}}).catch(()=>{})}});

 const cats=CATS[draft.type],idx=cats.indexOf(draft.cat);
 const delta=!cancel&&Math.abs(dx)>Math.min(65,step*.18)?(dx<0?1:-1):0;

function variantGroupMembers(records, targetId){
 const ids=new Set([targetId]);let changed=true;

  if((linked.some(id=>ids.has(id)))&&linked.some(id=>!ids.has(id))){
   linked.forEach(id=>ids.add(id));changed=true;
  }
 }}
 const groupIds=new Set(records.filter(r=>ids.has(r.id)&&r.variantGroupId).map(r=>r.variantGroupId));
 if(groupIds.size){let again=true;while(again){again=false;for(const r of records){
  if(r.variantGroupId&&groupIds.has(r.variantGroupId)&&!ids.has(r.id)){

   if(r.variantParentId)ids.add(r.variantParentId);
  }
 }}}

}
function variantGroupId(records,targetId){

/* Pricoletta unified registration + item editor styling — visual-only v2.9 */
:root{
 --pc-surface:#fffefd;
 --pc-surface-soft:#fff7fc;
 --pc-outline-strong:#f3c1df;
 --pc-heading:#d65c9e;
 --pc-muted:#9d8195;
 --pc-focus:#a66bd0;
 --pc-radius-panel:20px;
 --pc-radius-slot:16px;
}
/* The fixed registration layout and its independently scrolling strips are preserved. */
.registration-fixed .new-reg .reg-body{
 background:var(--pc-surface)!important;
 border-color:var(--pc-outline-strong)!important;
 border-radius:var(--pc-radius-panel)!important;
 box-shadow:0 3px 0 #f8d8ea!important;
}
.registration-fixed .new-reg .reg-page-title,
.registration-fixed .new-reg .reg-colors-heading{color:var(--pc-heading)!important}
.registration-fixed .new-reg .image-grid .slot{
 border-color:#e8afd2!important;
 border-radius:var(--pc-radius-slot)!important;
 background:var(--pc-surface-soft)!important;
}
.registration-fixed .new-reg .reg-tray-add{
 border-color:#e8afd2!important;
 border-radius:var(--pc-radius-slot)!important;
 background:var(--pc-surface-soft)!important;
}
.registration-fixed .new-reg .reg-footer .game-button,
.ie-save{
 border:3px solid white!important;
 border-radius:var(--pc-radius-button)!important;
 background:var(--pc-pink)!important;
 color:white!important;
 box-shadow:0 5px var(--pc-pink-shadow),inset 0 0 0 2px var(--pc-pink-inset)!important;
 text-shadow:0 1px #be4785;
 font-weight:900!important;
}
.registration-fixed .new-reg .reg-footer .game-button:active,
.ie-save:not(:disabled):active{
 transform:translateY(3px);
 box-shadow:0 2px var(--pc-pink-shadow),inset 0 0 0 2px var(--pc-pink-inset)!important;
}
/* The editor stays a centered overlay; its header/footer are fixed and body scrolls. */
.ie-backdrop{background:rgba(75,39,65,.57)}
.ie-modal{
 border-color:var(--pc-outline-strong);
 border-radius:var(--pc-radius-panel);
 background:var(--pc-surface);
 color:var(--pc-ink);
 box-shadow:0 12px 36px rgba(91,43,75,.25);
}
.ie-header,.ie-footer{background:var(--pc-surface);border-color:var(--pc-outline-strong)}
.ie-header strong{color:var(--pc-heading)}
.ie-close{
 border-color:var(--pc-secondary-outline);
 border-radius:12px;
 background:var(--pc-soft);
 color:var(--pc-secondary-ink);
}
.ie-scroll{background:var(--pc-surface)}
.ie-media button{
 border-color:#e8afd2;
 border-radius:var(--pc-radius-slot);
 background:var(--pc-surface-soft);
 color:var(--pc-heading);
}
.ie-section h3{color:var(--pc-heading)}
.ie-tag-group h4{color:var(--pc-ink)}
.ie-chip,.ie-add{
 border-color:var(--pc-secondary-outline);
 background:var(--pc-soft);
 color:var(--pc-secondary-ink);
}
.ie-chip.on{
 background:var(--pc-pink);
 border-color:var(--pc-pink-shadow);
 color:white;
}
.ie-add{border-style:dashed;background:var(--pc-surface)}
.ie-memo{border-color:var(--pc-secondary-outline);color:var(--pc-ink);background:white}
.ie-mark{border-color:var(--pc-secondary-outline);color:var(--pc-secondary-ink)}
.ie-mark.on{background:var(--pc-pink);border-color:var(--pc-pink-shadow);color:white}
.ie-save{outline:none!important;min-height:49px}
.ie-save:disabled{opacity:.55}
.ie-close:focus-visible,.ie-media button:focus-visible,.ie-chip:focus-visible,
.ie-add:focus-visible,.ie-memo:focus-visible,.ie-save:focus-visible,
.registration-fixed .new-reg button:focus-visible{
 outline:3px solid var(--pc-focus)!important;
 outline-offset:2px;
}

/* v2.9.3: only the back control is fixed; original primary actions stay in their cards. */
.page-scroll.pc-flow-screen .reg-footer{display:grid!important}
.page-scroll.pc-flow-screen .reg-footer .reg-back{display:none!important}
.page-scroll.pc-flow-screen .dest-bottom .dest-confirm{display:block!important}
.page-scroll.pc-flow-screen>.card{min-height:0;overflow-y:auto}
.pc-flow-footer.pc-back-only{display:flex!important;justify-content:flex-start!important;align-items:center!important;flex:0 0 auto!important;padding:5px 12px calc(5px + env(safe-area-inset-bottom))!important;margin-top:auto!important;min-height:48px!important}
.pc-flow-footer.pc-back-only .pc-flow-back{width:auto!important;text-align:left!important;padding:8px 4px!important}

.pc-new-button{border:2px solid #dca5c8;border-radius:14px;background:white;color:#b45792;font-weight:700;padding:12px}
.pc-new-panel{background:#fff;border:2px solid #f0c6df;border-radius:17px;padding:15px;display:flex;flex-direction:column;gap:12px}
.pc-new-panel>strong{color:#955c82}.pc-variant-option{display:flex;gap:9px;align-items:center;padding:9px 6px;color:#875c7c;font-size:14px}
.pc-variant-option input{accent-color:#e60060}.pc-variant-list{max-height:200px;overflow-y:auto;border:1px solid #f0c6df;border-radius:12px;padding:5px}
 .pc-group-count{display:block;color:#a18a99;font-size:11px;margin-top:3px}
