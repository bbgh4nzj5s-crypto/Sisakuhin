<body><div class="app"><section id="title-screen" class="screen title-screen"><div class="title-content"><div style="color:#e8a1c9">✦ ♡ ✦</div><div class="logo">Pricoletta</div><div class="logo-sub">プリコレッタ</div><div class="notice"><h1>♡ おねがい！ ♡</h1><p class="notice-main">QRコードが写った画像は、SNSやインターネットに公開しないでね。</p><p class="notice-small">本アプリではコーデやアイテムの画像と一緒にQRコードを管理できます。スクリーンショットを共有するときはQRが写らないよう注意してね。</p><p class="notice-small emphasis">QR画像はこの端末内に保存されます。</p></div><button class="game-button" id="start-button">はじめる →</button></div></section><section id="main-screen" class="screen main-screen hidden"><header class="topbar"><span class="mini-logo">♡ Pricoletta</span><span id="page-heading">ホーム</span></header><main class="page-scroll" id="page-content"></main><nav class="bottom-nav"><button data-page="home" class="nav-button active"><span class="nav-icon">⌂</span>ホーム</button><button data-page="items" class="nav-button"><span class="nav-icon">▦</span>コーデ<br>アイテム</button><button data-page="register" class="nav-button"><span class="nav-icon">＋</span>アイテム<br>を登録</button><button data-page="dressup" class="nav-button"><span class="nav-icon">♧</span>きせかえ</button><button data-page="extra" class="nav-button"><span class="nav-icon">⋯</span>？？？</button></nav></section></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), content=$('#page-content'), heading=$('#page-heading');
const K='pricoletta_draft_v2',S='pricoletta_records_v2',D='pricoletta_assets_v2',STORE='assets';
const CATS={separate:['アクセ','トップス','ボトムス','シューズ'],dress:['アクセ','ワンピース','シューズ']};
const COLORS=[['ピンク','#f58bbf'],['赤','#e76068'],['オレンジ','#f4a153'],['黄色','#efd35b'],['緑','#73b67c'],['水色','#8bd3eb'],['青','#6d91df'],['紫','#ab91d3'],['白','#ffffff'],['黒','#37343b'],['茶色','#a27b60'],['グレー','#a6a4a9']];
const fresh=()=>({name:'',type:'separate',step:0,cat:'アクセ',items:{},unplaced:[],thumbnail:null,full:null,destination:'グループ1',existingId:null});
let draft=fresh(),db=null,urls=[],drag=null,busy=false,suppressTap=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};
const saveDraft=()=>{try{localStorage.setItem(K,JSON.stringify(draft));return true}catch(e){console.warn('draft save unavailable',e);return false}};
function item(cat){return draft.items[cat]??(draft.items[cat]={image:null,qrPhoto:null,qrDigital:null,qrPayload:null,qrError:'',checked:false,colors:[],manualColors:false,rank:[]});}
function status(cat){const i=item(cat);return i.checked?'登録済み':i.image||i.qrPhoto||i.qrDigital||i.colors.length||i.commonFull||i.commonTB?'QR未登録':'未登録';}
function statusClass(cat){return status(cat)==='登録済み'?'st-done':status(cat)==='QR未登録'?'st-partial':'st-empty'}
function statusSymbol(cat){return status(cat)==='登録済み'?'✓':status(cat)==='QR未登録'?'!':'−'}
function openDB(){if(db)return Promise.resolve(db);return new Promise((ok,no)=>{const r=indexedDB.open(D,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)})}
async function store(blob){const d=await openDB(),id=crypto.randomUUID();await new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(blob,id);t.oncomplete=ok;t.onerror=()=>no(t.error)});return id}
async function blob(id){if(!id)return null;const d=await openDB();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
async function url(id){const b=await blob(id);if(!b)return '';const u=URL.createObjectURL(b);urls.push(u);return u}
function revoke(){urls.forEach(URL.revokeObjectURL);urls=[]}
function pages(key){content.classList.remove('registration-fixed');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key));revoke();heading.textContent={home:'ホーム',items:'コーデアイテム',register:'アイテムを登録',dressup:'きせかえ',extra:'？？？'}[key];if(key==='home')content.innerHTML='<h1 class="page-title">♡ ホーム ♡</h1><p class="page-sub">プリコレッタへようこそ！</p><div class="menu-stack">'+[['items','コーデアイテム'],['register','アイテムを登録'],['dressup','きせかえ'],['extra','？？？']].map(x=>'<button class="game-button" data-go="'+x[0]+'">'+x[1]+' →</button>').join('')+'</div>';
else if(key==='register')content.innerHTML='<h1 class="page-title">♡ アイテムを登録 ♡</h1><p class="page-sub">登録方法をえらんでね</p><div class="registration-list">'+[['single','ひとつずつ登録','アイテムを1つずつ登録する'],['batch','まとめて登録','同じコーデのアイテムをまとめて登録する'],['pro','まとめて登録 Pro','異なるコーデのアイテムもまとめて登録する（上級者向け）']].map(x=>'<button class="registration-option" data-method="'+x[0]+'"><span class="registration-name">'+x[1]+' ›</span><span class="registration-description">'+x[2]+'</span></button>').join('')+'<div class="registration-unavailable">URLから登録<br><small>現在、この機能はご利用いただけません。</small></div></div>';
else if(key==='items')listRecords();else content.innerHTML='<div class="placeholder"><h2>'+heading.textContent+'</h2><p>このページはこれから追加できます。</p></div>';content.scrollTop=0}
function listRecords(){const recs=parse(S,[]);content.innerHTML='<h1 class="page-title">♡ コーデアイテム ♡</h1>'+(recs.length?recs.map(r=>'<button class="match" data-open="'+esc(r.id)+'"><strong>'+esc(r.name)+'</strong><small>'+CATS[r.type].map(c=>esc(c)+'：'+(r.items[c]?.checked?'登録済み':r.items[c]?.image||r.items[c]?.qrPhoto||r.items[c]?.colors?.length?'QR未登録':'未登録')).join(' ／ ')+'</small></button>').join(''):'<div class="placeholder">まだコーデが登録されていません。</div>')}
function shell(body){revoke();heading.textContent='ひとつずつ登録';content.classList.toggle('registration-fixed',draft.step===3);content.innerHTML='<button class="back-to-registration" data-act="exit">‹ 登録方法にもどる</button><div class="steps">'+['コーデ','確認','全体情報','アイテム','保存先','確認'].map((x,i)=>'<span class="'+(i===draft.step?'current':'')+'">'+x+'</span>').join('')+'</div><p class="save-note">入力内容と未配置画像は、この端末に自動保存されます。</p><section class="card">'+body+'</section>';content.scrollTop=0;hydrate()}
function btn(label,act){return '<button class="game-button" data-act="'+act+'">'+label+'</button>'}
function matches(){const q=draft.name.toLocaleLowerCase();return parse(S,[]).filter(r=>r.name.toLocaleLowerCase().includes(q)||q.includes(r.name.toLocaleLowerCase())).sort((a,b)=>(b.name===draft.name)-(a.name===draft.name))}
function render(){saveDraft();if(draft.step===0){shell('<h2>コーデ名を入力 ♡</h2><label>コーデ名（必須）</label><input class="field" id="name" value="'+esc(draft.name)+'" placeholder="コーデ名を入力" maxlength="100" autocomplete="off"><div class="name-hints" id="name-hints"></div>'+btn('けってい →','name'));suggest();return}
if(draft.step===1){const m=matches();shell('<h2>登録済みのコーデを確認</h2><p class="hint">色違いは別のコーデとして登録できます。</p>'+(m.length?m.map(r=>'<button class="match" data-existing="'+esc(r.id)+'"><strong>'+esc(r.name)+'</strong><small>'+CATS[r.type].map(c=>esc(c)+'：'+(r.items[c]?.checked?'登録済み':r.items[c]?.image||r.items[c]?.qrPhoto||r.items[c]?.colors?.length?'QR未登録':'未登録')).join(' ／ ')+'</small><small>このコーデに追加する →</small></button>').join(''):'<p>似た名前の登録済みコーデはありません。</p>')+btn('新しいコーデとして登録する →','new')+'<button class="subbutton" data-act="back">名前を修正する</button>');return}
if(draft.step===2){shell('<h2>コーデ全体の情報 ♡</h2><p class="hint">画像は任意です。</p><div class="image-grid"><div class="slot" data-slot="thumbnail"><span data-preview="thumbnail">＋ サムネイル画像</span></div><div class="slot" data-slot="full"><span data-preview="full">＋ 全身画像</span></div></div><h3>コーデのタイプ</h3><label class="check"><input type="radio" name="type" value="separate" '+(draft.type==='separate'?'checked':'')+'> トップス＆ボトムスタイプ</label><label class="check"><input type="radio" name="type" value="dress" '+(draft.type==='dress'?'checked':'')+'> ワンピースタイプ</label>'+btn('アイテム登録へ →','items'));return}
if(draft.step===3){const i=item(draft.cat);shell('<div class="reg-fixed"><div class="reg-top"><div class="category-tabs">'+CATS[draft.type].map(c=>'<button class="'+(draft.cat===c?'active ':'')+statusClass(c)+'" data-cat="'+esc(c)+'"><strong>'+esc(c)+'</strong><small>'+statusSymbol(c)+' '+status(c)+'</small></button>').join('')+'</div></div><div class="reg-body"><div class="item-heading"><strong>'+esc(draft.cat)+'</strong><span class="status '+statusClass(draft.cat)+'">'+statusSymbol(draft.cat)+' '+status(draft.cat)+'</span></div><div class="image-grid"><div class="slot" data-slot="image"><span data-preview="image">＋ アイテム画像</span></div><div class="slot" data-slot="qr"><span data-preview="qr">＋ QR画像</span></div></div><div class="reg-checks"><label class="check"><input id="registered" type="checkbox" '+(i.checked?'checked':'')+'> QRを登録済みにする</label><label class="check"><input data-common="full" type="checkbox" '+(i.commonFull?'checked':'')+'> フルコーデが共通のQR</label><label class="check"><input data-common="tb" type="checkbox" '+(i.commonTB?'checked':'')+'> トップス＆ボトムスが共通のQR</label></div>'+(i.qrError?'<p class="error reg-qr-error">'+esc(i.qrError)+'</p>':'')+'<div class="reg-colors-heading">カラータグ <small>横にスワイプ</small></div><div class="colors" id="colors"></div></div><div class="reg-tray-area"><div class="reg-tray-heading"><strong>未配置の画像</strong><button class="subbutton" data-act="add">＋ 画像を追加</button></div><div class="tray" id="tray"></div></div><div class="reg-footer">'+btn('保存先を選ぶ →','destination')+'</div></div>');return}
if(draft.step===4){shell('<h2>保存先を選択 ♡</h2>'+['グループ1','グループ2','グループ3'].map(n=>'<label class="check"><input type="radio" name="destination" value="'+n+'" '+(draft.destination===n?'checked':'')+'> '+n+'</label>').join('')+btn('確認へ →','confirm'));return}
shell('<h2>登録内容を確認 ♡</h2><p><strong>'+esc(draft.name)+'</strong></p><p>保存先：'+esc(draft.destination)+'</p>'+CATS[draft.type].map(c=>'<div class="result">'+esc(c)+'：<strong>'+status(c)+'</strong></div>').join('')+btn('この内容で保存 ♡','save'))}
function suggest(){const box=$('#name-hints');if(!box)return;const q=draft.name.toLowerCase();const old=parse('pricoletta_coordinate_names',[]);const names=[...new Set([...parse(S,[]).map(r=>r.name),...old])].filter(n=>n.toLowerCase().includes(q)&&n!==draft.name&&q).slice(0,5);box.innerHTML=names.map(n=>'<button data-suggest="'+esc(n)+'">'+esc(n)+'</button>').join('')}
function colors(){const box=$('#colors');if(!box)return;const i=item(draft.cat),order=i.rank?.length?i.rank:COLORS.map(c=>c[0]);box.innerHTML=order.map(n=>'<label class="color"><input type="checkbox" data-color="'+n+'" '+(i.colors.includes(n)?'checked':'')+'><span class="color-dot" style="background:'+COLORS.find(c=>c[0]===n)[1]+'"></span><small>'+n+'</small></label>').join('')}
async function hydrate(){if(draft.step===3){colors();const tray=$('#tray');if(tray){tray.innerHTML=draft.unplaced.length?'':'<span class="hint">まだ画像がありません</span>';for(const id of draft.unplaced){const u=await url(id);if(!tray.isConnected)return;const el=document.createElement('div');el.className='tray-img';el.dataset.tray=id;el.innerHTML='<img src="'+u+'" alt="未配置画像"><button class="remove" data-remove-tray="'+id+'" aria-label="未配置から削除">×</button>';tray.append(el)}}}
for(const slot of content.querySelectorAll('[data-preview]')){const kind=slot.dataset.preview,i=item(draft.cat),id=kind==='image'?i.image:kind==='qr'?(i.qrDigital||i.qrPhoto):draft[kind];if(!id)continue;const u=await url(id);if(!slot.isConnected)return;slot.innerHTML='<img src="'+u+'" alt="登録済み画像">';const parent=slot.closest('[data-slot]');if(parent&&!parent.querySelector('.remove')){const b=document.createElement('button');b.className='remove';b.textContent='×';b.title='画像を未配置へ戻す';b.dataset.return=kind;parent.append(b)}}}
async function analyze(cat){const i=item(cat);if(i.manualColors)return;const score=new Map(COLORS.map(([n])=>[n,0]));for(const [n] of COLORS)if(draft.name.includes(n))score.set(n,10000);if(i.image){try{const b=await blob(i.image),bitmap=await createImageBitmap(b),cv=document.createElement('canvas');cv.width=cv.height=48;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,48,48);bitmap.close();const data=ctx.getImageData(0,0,48,48).data;for(let j=0;j<data.length;j+=16){if(data[j+3]<128)continue;if(data[j]>247&&data[j+1]>247&&data[j+2]>247)continue;let best='',dist=Infinity;for(const [n,hex] of COLORS){const rgb=[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16));const d=rgb.reduce((s,v,k)=>s+(v-data[j+k])**2,0);if(d<dist){dist=d;best=n}}score.set(best,score.get(best)+1)}}catch(e){console.warn(e)}}i.rank=[...score].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);i.colors=i.rank.slice(0,2);saveDraft();colors()}
async function readQR(id){const b=await blob(id),bitmap=await createImageBitmap(b);try{if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const results=await detector.detect(bitmap);if(results[0]?.rawValue)return results[0].rawValue}catch(e){console.warn(e)}}if(typeof jsQR==='function'){const cv=document.createElement('canvas');const max=1200,ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));cv.width=Math.round(bitmap.width*ratio);cv.height=Math.round(bitmap.height*ratio);const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,cv.width,cv.height);const d=ctx.getImageData(0,0,cv.width,cv.height);return jsQR(d.data,d.width,d.height)?.data||null}return null}finally{bitmap.close()}}
async function makeQR(payload){if(typeof qrcode!=='function')throw Error('QR生成ライブラリを読み込めませんでした');const q=qrcode(0,'M');q.addData(payload);q.make();const n=q.getModuleCount(),scale=8,pad=4,cv=document.createElement('canvas');cv.width=cv.height=(n+pad*2)*scale;const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='black';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+pad)*scale,(y+pad)*scale,scale,scale);const b=await new Promise(ok=>cv.toBlob(ok,'image/png'));return store(b)}
async function assign(id,kind){if(['thumbnail','full'].includes(kind)){if(draft[kind])draft.unplaced.push(draft[kind]);draft[kind]=id}else{const i=item(draft.cat);if(kind==='image'){if(i.image)draft.unplaced.push(i.image);i.image=id;i.manualColors=false;await analyze(draft.cat)}else{if(i.qrPhoto)draft.unplaced.push(i.qrPhoto);i.qrPhoto=id;i.qrDigital=null;i.qrPayload=null;i.qrError='';let value=null;try{value=await readQR(id)}catch(e){console.warn('QR decode failed',e)}if(value){try{i.qrDigital=await makeQR(value);i.qrPayload=value;i.checked=true}catch(e){i.qrError='QRは読み取れましたがデジタル化に失敗しました。チェックは自動変更していません。'}}else i.qrError='QRを読み取れませんでした。元の写真は保存しています。'}}draft.unplaced=draft.unplaced.filter(x=>x!==id);saveDraft()}
async function returnSlot(kind){const i=item(draft.cat);if(kind==='image'){if(i.image)draft.unplaced.push(i.image);i.image=null}else if(kind==='qr'){if(i.qrPhoto)draft.unplaced.push(i.qrPhoto);i.qrPhoto=null;i.qrDigital=null;i.qrPayload=null;i.qrError=''}else{if(draft[kind])draft.unplaced.push(draft[kind]);draft[kind]=null}saveDraft();render()}
async function optimizeImage(file,maxSide){
  // iOS photos can be very large. Keep the original when decoding is unsupported.
  if(file.size<1100000)return file;
  try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bitmap.width*scale));cv.height=Math.max(1,Math.round(bitmap.height*scale));cv.getContext('2d').drawImage(bitmap,0,0,cv.width,cv.height);bitmap.close();const compressed=await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',.88));return compressed&&compressed.size<file.size?compressed:file}catch(e){console.warn('image optimization skipped',e);return file}
}
async function upload(kind){const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=kind==='tray';input.onchange=async()=>{if(!input.files?.length)return;try{for(const f of input.files){if(!f.type.startsWith('image/'))continue;const optimized=await optimizeImage(f,kind==='qr'?1800:1400);const id=await store(optimized);if(kind==='tray')draft.unplaced.push(id);else await assign(id,kind)}saveDraft();render()}catch(e){console.error('image save',e);alert('画像を保存できませんでした（'+(e?.name||'不明なエラー')+'）。Safariの通常タブで開き直して再試行してください。')}};input.click()}
function chooseTray(id){const kind=prompt('配置先を選んでね。\n1：アイテム画像\n2：QR画像','1');if(kind===null)return;const k=kind.trim()==='2'?'qr':kind.trim()==='1'?'image':null;if(!k){alert('1か2を入力してね');return}assign(id,k).then(render).catch(()=>alert('画像を配置できませんでした'))}
function save(){const recs=parse(S,[]);const id=draft.existingId||crypto.randomUUID(),entry={id,name:draft.name,type:draft.type,items:draft.items,thumbnail:draft.thumbnail,full:draft.full,destination:draft.destination,updatedAt:new Date().toISOString()};const pos=recs.findIndex(r=>r.id===id);if(pos>=0)recs[pos]=entry;else recs.push(entry);try{localStorage.setItem(S,JSON.stringify(recs));const names=[...new Set([draft.name,...parse('pricoletta_coordinate_names',[])])];localStorage.setItem('pricoletta_coordinate_names',JSON.stringify(names));localStorage.removeItem(K);draft=fresh();alert('保存しました ♡');pages('items')}catch(e){alert('保存に失敗しました。端末の空き容量を確認してね')}}
function start(){draft=parse(K,fresh());if(!draft?.items||!Array.isArray(draft.unplaced))draft=fresh();render()}
$('#start-button').addEventListener('click',()=>{$('#title-screen').classList.add('hidden');$('#main-screen').classList.remove('hidden');pages('home')});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>pages(b.dataset.page)));
content.addEventListener('input',e=>{if(e.target.id==='name'){draft.name=e.target.value;saveDraft();suggest()}});
content.addEventListener('change',e=>{if(e.target.dataset.common){item(draft.cat)[e.target.dataset.common==='full'?'commonFull':'commonTB']=e.target.checked;saveDraft();render();return}if(e.target.id==='registered'){item(draft.cat).checked=e.target.checked;saveDraft();render()}else if(e.target.matches('[data-color]')){const i=item(draft.cat),c=e.target.dataset.color;i.manualColors=true;i.colors=e.target.checked?[...new Set([...i.colors,c])]:i.colors.filter(x=>x!==c);saveDraft()}else if(e.target.name==='type'){draft.type=e.target.value;saveDraft()}else if(e.target.name==='destination'){draft.destination=e.target.value;saveDraft()}});
content.addEventListener('click',async e=>{if(suppressTap){suppressTap=false;return}if(busy)return;const b=e.target.closest('button,[data-slot],[data-tray]');if(!b)return;if(b.dataset.go){pages(b.dataset.go);return}if(b.dataset.method){if(b.dataset.method==='single')start();else{heading.textContent=b.dataset.method==='batch'?'まとめて登録':'まとめて登録 Pro';content.innerHTML='<button class="back-to-registration" data-go="register">‹ 登録方法にもどる</button><div class="placeholder">この登録方法は今後実装予定です。</div>'}return}if(b.dataset.cat){draft.cat=b.dataset.cat;render();return}if(b.dataset.suggest){draft.name=b.dataset.suggest;render();return}if(b.dataset.existing){const r=parse(S,[]).find(x=>x.id===b.dataset.existing);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destination,existingId:r.id,step:2};render()}return}if(b.dataset.open){const r=parse(S,[]).find(x=>x.id===b.dataset.open);if(r){draft={...fresh(),name:r.name,type:r.type,items:structuredClone(r.items),thumbnail:r.thumbnail,full:r.full,destination:r.destination,existingId:r.id,step:3};render()}return}if(b.dataset.removeTray){draft.unplaced=draft.unplaced.filter(x=>x!==b.dataset.removeTray);saveDraft();render();return}if(b.dataset.return){await returnSlot(b.dataset.return);return}if(b.dataset.tray){chooseTray(b.dataset.tray);return}if(b.dataset.slot){upload(b.dataset.slot);return}const a=b.dataset.act;if(!a)return;if(a==='exit'){pages('register');return}if(a==='back'){draft.step=Math.max(0,draft.step-1);render();return}if(a==='name'){draft.name=$('#name')?.value.trim()||'';if(!draft.name){alert('コーデ名を入力してね');return}draft.step=1}else if(a==='new'){draft.existingId=null;draft.items={};draft.step=2}else if(a==='items'){draft.step=3;draft.cat=CATS[draft.type][0];for(const c of CATS[draft.type]){const i=item(c);if(!i.manualColors&&!i.image&&!i.colors.length){i.rank=COLORS.map(x=>x[0]);const names=COLORS.filter(x=>draft.name.includes(x[0])).map(x=>x[0]);if(names.length){i.rank=[...names,...i.rank.filter(x=>!names.includes(x))];i.colors=names.slice(0,2)}}}}else if(a==='destination')draft.step=4;else if(a==='confirm')draft.step=5;else if(a==='save'){save();return}else if(a==='add'){upload('tray');return}render()});
// iPhone pointer drag with visual feedback; tap is always available as fallback.
content.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-tray]');if(!t||e.target.closest('[data-remove-tray]'))return;drag={id:t.dataset.tray,x:e.clientX,y:e.clientY,moved:false,ghost:null}});
content.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>13){drag.moved=true;const t=content.querySelector('[data-tray="'+drag.id+'"] img');if(t){drag.ghost=t.cloneNode();drag.ghost.className='drag-ghost';document.body.append(drag.ghost)}}if(drag.ghost){drag.ghost.style.left=(e.clientX-36)+'px';drag.ghost.style.top=(e.clientY-36)+'px'}});
content.addEventListener('pointerup',async e=>{if(!drag)return;const d=drag;drag=null;d.ghost?.remove();if(!d.moved)return;suppressTap=true;setTimeout(()=>{suppressTap=false},250);const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');if(target&&draft.unplaced.includes(d.id)){try{await assign(d.id,target.dataset.slot);render()}catch{alert('配置できませんでした')}}});
window.addEventListener('pagehide',saveDraft);
})();
</script></body></html>
